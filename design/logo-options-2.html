<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spotifry: fry logo ideas</title>
<style>
@font-face { font-family: Albert; src: url(../app/src/main/res/font/albertsans.ttf); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; }
body { background: #1c1e23; color: #F2F3F5; font-family: Albert, sans-serif; padding: 36px; }
h1 { font-size: 22px; font-weight: 700; }
p.lead { color: #b5bac2; font-size: 14px; margin: 6px 0 26px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 620px)); gap: 22px; }
.card { background: #0C0D10; border-radius: 22px; padding: 26px; }
.card h2 { font-size: 18px; font-weight: 700; }
.card h2 b { color: #5B95FF; margin-right: 8px; }
.card .why { color: #b5bac2; font-size: 14px; margin: 6px 0 22px; line-height: 1.45; }
.row { display: flex; align-items: center; gap: 22px; }
.tile { width: 128px; height: 128px; border-radius: 30px; display: grid; place-items: center; flex: none; }
.tile.dark { background: #102038; }
.tile.blue { background: #5B95FF; }
.tile svg { width: 112px; height: 112px; }
.small { display: flex; flex-direction: column; gap: 10px; }
.small .tile { width: 52px; height: 52px; border-radius: 13px; }
.small .tile svg { width: 46px; height: 46px; }
.word { display: flex; align-items: center; gap: 12px; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
.word svg { width: 40px; height: 40px; }
.word .dot { color: #5B95FF; }
.light { margin-top: 18px; background: #F4F5F7; color: #15181C; border-radius: 14px; padding: 14px 18px; display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; }
.light svg { width: 30px; height: 30px; }
</style>
</head>
<body>
<h1>Spotifry: four "fry" logo ideas</h1>
<p class="lead">Each one is shown as the phone icon (dark tile and blue tile), small icon size, and next to the name on dark and light backgrounds. Same blue as the app. All four use a real kitchen object for the fry joke.</p>
<div class="grid" id="grid"></div>
<script>
const B = "#5B95FF", D = "#0C0D10";
// each mark draws in `c` (main colour) on a tile whose colour is `bg`
const marks = [
  { id: "E", name: "Fried egg", why: "A fried egg where the yolk is the play button. The 'fry' joke in one shape, still readable as music because of the play sign.",
    svg: (c, bg, w) => `<svg viewBox="0 0 100 100"><path d="M50 15 C67 13 83 24 84 40 C85 52 78 58 82 68 C85 82 70 89 56 84 C44 92 24 88 20 74 C16 62 24 56 18 44 C14 30 32 17 50 15 Z" fill="${w}" stroke="${c}" stroke-width="${w === bg ? 4 : 0}"/><circle cx="50" cy="51" r="20" fill="${c}"/><path d="M45 42 L60 51 L45 60 Z" fill="${w}" stroke="${w}" stroke-width="3" stroke-linejoin="round"/></svg>` },
  { id: "F", name: "Record in a pan", why: "A frying pan seen from above, and what is cooking is a vinyl record. Music being fried, literally.",
    svg: (c, bg, w) => `<svg viewBox="0 0 100 100"><path d="M64 37 L86 15" stroke="${c}" stroke-width="10" stroke-linecap="round"/><circle cx="44" cy="57" r="31" fill="${c}"/><circle cx="44" cy="57" r="24" fill="none" stroke="${bg}" stroke-width="2" opacity=".55"/><circle cx="44" cy="57" r="18" fill="none" stroke="${bg}" stroke-width="2" opacity=".55"/><circle cx="44" cy="57" r="9" fill="${w}"/><circle cx="44" cy="57" r="2.5" fill="${c}"/></svg>` },
  { id: "G", name: "Fries as sound bars", why: "A carton of fries where the fries stand at different heights like the bars of a sound meter, with a play sign on the carton.",
    svg: (c, bg, w) => `<svg viewBox="0 0 100 100">${[[29, 30, -8], [37, 20, -4], [45, 14, 0], [53, 22, 4], [61, 32, 8]].map(([x, y, r]) => `<rect x="${x}" y="${y}" width="6" height="${60 - y}" rx="1" transform="rotate(${r} ${x + 3} 60)" fill="${w}" stroke="${c}" stroke-width="${w === bg ? 3 : 0}"/>`).join("")}<path d="M24 48 Q50 56 76 48 L69 86 Q68 88 66 88 L34 88 Q32 88 31 86 Z" fill="${c}"/><path d="M45 61 L58 68 L45 75 Z" fill="${bg}" stroke="${bg}" stroke-width="3" stroke-linejoin="round"/></svg>` },
  { id: "H", name: "Sizzling pan", why: "A pan from the side, and the sizzle rising out of it is a sound meter. Keeps the heat idea of the sizzling play button, with a real pan.",
    svg: (c, bg, w) => `<svg viewBox="0 0 100 100">${[[25, 38], [35, 26], [45, 32], [55, 22], [65, 40]].map(([x, y]) => `<rect x="${x}" y="${y}" width="6" height="${52 - y}" rx="3" fill="${w}" stroke="${c}" stroke-width="${w === bg ? 2.5 : 0}"/>`).join("")}<path d="M16 58 L76 58 L70 76 Q68 80 63 80 L29 80 Q24 80 22 76 Z" fill="${c}"/><path d="M76 62 L92 56" stroke="${c}" stroke-width="7" stroke-linecap="round"/></svg>` },
];
document.getElementById("grid").innerHTML = marks.map(m => `
  <div class="card">
    <h2><b>${m.id}</b>${m.name}</h2>
    <div class="why">${m.why}</div>
    <div class="row">
      <div class="tile dark">${m.svg(B, "#102038", "#F2F3F5")}</div>
      <div class="tile blue">${m.svg(D, B, "#FFFFFF")}</div>
      <div class="small"><div class="tile dark">${m.svg(B, "#102038", "#F2F3F5")}</div><div class="tile blue">${m.svg(D, B, "#FFFFFF")}</div></div>
    </div>
    <div class="row" style="margin-top:22px"><div class="word">${m.svg(B, D, "#F2F3F5")}<span>Spotifry<span class="dot">.</span></span></div></div>
    <div class="light">${m.svg("#1F5FD6", "#F4F5F7", "#F4F5F7")}Spotifry</div>
  </div>`).join("");
</script>
</body>
</html>
