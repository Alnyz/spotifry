<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spotifry · Import from Spotify</title>
<style>
@font-face { font-family: "Albert"; src: url("../app/src/main/res/font/albertsans.ttf"); font-weight: 400 700; }
:root {
  --bg: #F4F5F7; --surface: #FFFFFF; --high: #E6E8EC; --line: #E1E4E8; --outline: #C9CDD3;
  --ink: #15181C; --ink2: #525A64; --accent: #1F5FD6; --on-accent: #FFFFFF; --error: #B3261E;
  --glow: rgba(91,149,255,.22); --scrim: rgba(21,24,28,.38);
}
body.dark {
  --bg: #0C0D10; --surface: #17191E; --high: #1F2228; --line: #1F2228; --outline: #2A2E35;
  --ink: #F2F3F5; --ink2: #A6ADB6; --accent: #5B95FF; --on-accent: #08152E; --error: #F2877A;
  --glow: rgba(91,149,255,.20); --scrim: rgba(0,0,0,.55);
}
* { box-sizing: border-box; margin: 0; }
body { font-family: "Albert", sans-serif; background: #D9DCE1; color: var(--ink); padding: 28px 32px 48px; }
body.dark { background: #050608; }
header.page { display: flex; align-items: baseline; gap: 24px; margin-bottom: 24px; color: #15181C; }
body.dark header.page { color: #F2F3F5; }
header.page h1 { font-size: 22px; letter-spacing: -.02em; }
header.page button { font: 600 14px "Albert"; border: 1px solid currentColor; background: none; color: inherit; border-radius: 99px; padding: 6px 14px; cursor: pointer; }
.row { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; }
figure { width: 360px; }
figcaption { font-size: 14px; line-height: 20px; color: #3A4048; margin-top: 12px; max-width: 340px; }
body.dark figcaption { color: #A6ADB6; }
figcaption b { color: inherit; font-weight: 700; }

.phone { width: 360px; height: 780px; border-radius: 34px; overflow: hidden; position: relative; background: var(--bg); box-shadow: 0 18px 40px -12px rgba(0,0,0,.35); }
.phone::before { content: ""; position: absolute; inset: 0 0 auto auto; width: 300px; height: 260px; background: radial-gradient(closest-side, var(--glow), transparent); transform: translate(30%, -30%); pointer-events: none; }
.status { height: 34px; display: flex; justify-content: space-between; align-items: center; padding: 0 22px; font-size: 13px; font-weight: 600; }
.screen { padding: 0 20px; position: relative; }
h2.title { font-size: 34px; line-height: 40px; letter-spacing: -.68px; font-weight: 700; margin: 20px 0 16px; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 99px; font: 600 15px "Albert"; border: 0; }
.pill.tonal { background: var(--high); color: var(--ink); }
.pill.primary { background: var(--accent); color: var(--on-accent); }
.pill.wide { width: 100%; justify-content: center; height: 48px; }
.pill svg { width: 18px; height: 18px; }
.fab { position: absolute; right: 16px; bottom: 150px; height: 54px; padding: 0 22px; border-radius: 99px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; gap: 10px; font: 600 16px "Albert"; box-shadow: 0 6px 14px -4px rgba(31,95,214,.45); }
.fab svg { width: 20px; height: 20px; }
.empty { text-align: center; margin-top: 110px; }
.empty h3 { font-size: 24px; letter-spacing: -.48px; }
.empty p { color: var(--ink2); font-size: 15px; line-height: 22px; margin-top: 8px; }
.mini { position: absolute; left: 10px; right: 10px; bottom: 76px; height: 62px; border-radius: 18px; border: 1px solid var(--outline); background: color-mix(in srgb, var(--bg) 85%, transparent); display: flex; align-items: center; gap: 12px; padding: 0 12px; }
.mini .art { width: 42px; height: 42px; border-radius: 8px; background: linear-gradient(#c9b994, #8f7f5c); }
.mini b { font-size: 15px; display: block; } .mini span { font-size: 13px; color: var(--ink2); }
.nav { position: absolute; left: 0; right: 0; bottom: 0; height: 72px; display: flex; justify-content: space-around; align-items: center; font-size: 13px; color: var(--ink2); }
.nav div { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.nav svg { width: 22px; height: 22px; }
.nav .on { color: var(--accent); }

.scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 26px 26px 0 0; padding: 10px 22px 28px; }
.handle { width: 32px; height: 4px; border-radius: 4px; background: var(--outline); margin: 0 auto 20px; }
.sheet h3 { font-size: 21px; line-height: 26px; letter-spacing: -.42px; font-weight: 700; }
.sheet .sub { color: var(--ink2); font-size: 14px; line-height: 20px; margin-top: 4px; }
.field { margin: 18px 0 8px; height: 54px; border-radius: 16px; border: 1.5px solid var(--accent); display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 15px; color: var(--ink); overflow: hidden; white-space: nowrap; }
.field svg { width: 20px; height: 20px; flex: none; color: var(--ink2); }
.field span { overflow: hidden; text-overflow: ellipsis; }
.hint { font-size: 13px; line-height: 18px; color: var(--ink2); margin-bottom: 18px; }
.bar { height: 6px; border-radius: 6px; background: var(--high); margin: 16px 0 6px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 12%; background: var(--accent); border-radius: 6px; }
.count { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.list { margin-top: 14px; }
.song { display: flex; align-items: center; gap: 12px; height: 52px; }
.song .dot { width: 22px; height: 22px; flex: none; display: grid; place-items: center; }
.song .dot svg { width: 18px; height: 18px; }
.song .t { flex: 1; min-width: 0; }
.song .t b { font-weight: 600; font-size: 15px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song .t span { font-size: 13px; color: var(--ink2); }
.song.found .dot { color: var(--accent); }
.song.miss .dot { color: var(--ink2); }
.song.now .dot svg { animation: spin 1s linear infinite; }
.song .act { font: 600 14px "Albert"; color: var(--accent); }
@keyframes spin { to { transform: rotate(360deg); } }
.done-head { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
.cover4 { width: 64px; height: 64px; border-radius: 12px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; flex: none; }
.cover4 i:nth-child(1) { background: #6D8FB0; } .cover4 i:nth-child(2) { background: #4F6D63; } .cover4 i:nth-child(3) { background: #8A4A5A; } .cover4 i:nth-child(4) { background: #5D5785; }
.label { font-size: 15px; font-weight: 700; margin: 20px 0 4px; }
.actions { display: flex; gap: 10px; }
.actions .pill { flex: 1; justify-content: center; height: 48px; }
.ghost { text-align: center; font: 600 15px "Albert"; color: var(--accent); margin-top: 14px; }
</style>
</head>
<body>
<header class="page">
  <h1>Import from Spotify — 4 steps</h1>
  <button onclick="document.body.classList.toggle('dark')">Switch light / dark</button>
</header>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-import" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></symbol>
  <symbol id="i-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24" fill="currentColor"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></symbol>
  <symbol id="i-saved" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/><path d="M8.5 10.5L12 14l3.5-3.5" stroke="var(--bg)" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
  <symbol id="i-lists" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h14M4 11h14M4 16h8M17 14v6a2 2 0 1 1-2-2h2"/></symbol>
</svg>

<template id="chrome">
  <div class="mini"><div class="art"></div><div><b>To Whom It May Concern</b><span>Creed</span></div></div>
  <div class="nav">
    <div><svg><use href="#i-home"/></svg>Listen</div>
    <div><svg><use href="#i-saved"/></svg>Saved</div>
    <div class="on"><svg><use href="#i-lists"/></svg>Playlists</div>
  </div>
</template>

<div class="row">
  <!-- 1 -->
  <figure>
    <div class="phone">
      <div class="status"><span>00.07</span><span>40%</span></div>
      <div class="screen">
        <h2 class="title">Playlists</h2>
        <span class="pill tonal"><svg><use href="#i-import"/></svg>Import from Spotify</span>
        <div class="empty">
          <h3>No playlists yet</h3>
          <p>Tap New playlist, then add songs<br>from the three dots next to any song.</p>
        </div>
      </div>
      <div class="fab"><svg><use href="#i-plus"/></svg>New playlist</div>
      <div class="chrome"></div>
    </div>
    <figcaption><b>1. Playlists page.</b> A grey "Import from Spotify" button sits under the title, always there, also when you have playlists. Blue "New playlist" stays the main button.</figcaption>
  </figure>

  <!-- 2 -->
  <figure>
    <div class="phone">
      <div class="status"><span>00.07</span><span>40%</span></div>
      <div class="screen"><h2 class="title">Playlists</h2><span class="pill tonal"><svg><use href="#i-import"/></svg>Import from Spotify</span></div>
      <div class="chrome"></div>
      <div class="scrim"></div>
      <div class="sheet">
        <div class="handle"></div>
        <h3>Import from Spotify</h3>
        <p class="sub">Paste the link from Spotify: Share → Copy link.</p>
        <div class="field"><svg><use href="#i-link"/></svg><span>https://open.spotify.com/playlist/2wauuVc0v7DBWGylJ6nFFr?si=rEWz</span></div>
        <p class="hint">Public playlists only. The first 100 songs come over.</p>
        <span class="pill primary wide">Import</span>
      </div>
    </div>
    <figcaption><b>2. Paste the link.</b> A sheet slides up. If the clipboard already holds a Spotify link, it's filled in for you. A wrong link shows "That isn't a Spotify playlist link" under the box.</figcaption>
  </figure>

  <!-- 3 -->
  <figure>
    <div class="phone">
      <div class="status"><span>00.08</span><span>40%</span></div>
      <div class="screen"><h2 class="title">Playlists</h2></div>
      <div class="chrome"></div>
      <div class="scrim"></div>
      <div class="sheet">
        <div class="handle"></div>
        <h3>chill</h3>
        <p class="sub">Finding each song on YouTube</p>
        <div class="bar"><i></i></div>
        <div class="count"><span>12 of 100</span><span>About 2 minutes left</span></div>
        <div class="list">
          <div class="song now"><div class="dot"><svg><use href="#i-spin"/></svg></div><div class="t"><b>群青</b><span>YOASOBI</span></div></div>
          <div class="song found"><div class="dot"><svg><use href="#i-check"/></svg></div><div class="t"><b>たぶん</b><span>YOASOBI</span></div></div>
          <div class="song found"><div class="dot"><svg><use href="#i-check"/></svg></div><div class="t"><b>Into The Night</b><span>YOASOBI</span></div></div>
          <div class="song miss"><div class="dot"><svg><use href="#i-x"/></svg></div><div class="t"><b>夜に駆ける (Live)</b><span>YOASOBI · not found</span></div></div>
          <div class="song found"><div class="dot"><svg><use href="#i-check"/></svg></div><div class="t"><b>KOKORO NO TOMO</b><span>Mayumi Itsuwa, DELON</span></div></div>
        </div>
        <p class="hint" style="margin:14px 0 0">Keep Spotifry open until it's done. Music keeps playing.</p>
      </div>
    </div>
    <figcaption><b>3. Finding songs.</b> A bar and a count. The newest songs show on top: a tick when it's found, a cross when it isn't. Close the sheet and the import stops; songs found so far stay.</figcaption>
  </figure>

  <!-- 4 -->
  <figure>
    <div class="phone">
      <div class="status"><span>00.10</span><span>39%</span></div>
      <div class="screen"><h2 class="title">Playlists</h2></div>
      <div class="chrome"></div>
      <div class="scrim"></div>
      <div class="sheet">
        <div class="handle"></div>
        <div class="done-head">
          <div class="cover4"><i></i><i></i><i></i><i></i></div>
          <div><h3>chill</h3><p class="sub">97 of 100 songs added</p></div>
        </div>
        <div class="actions"><span class="pill primary">Open playlist</span><span class="pill tonal">Done</span></div>
        <p class="label">3 not found</p>
        <div class="song miss"><div class="dot"><svg><use href="#i-x"/></svg></div><div class="t"><b>夜に駆ける (Live)</b><span>YOASOBI</span></div><span class="act">Search</span></div>
        <div class="song miss"><div class="dot"><svg><use href="#i-x"/></svg></div><div class="t"><b>Lagu Rindu – Acoustic</b><span>Sample Artist</span></div><span class="act">Search</span></div>
        <div class="song miss"><div class="dot"><svg><use href="#i-x"/></svg></div><div class="t"><b>Untitled Demo 3</b><span>Sample Artist</span></div><span class="act">Search</span></div>
      </div>
    </div>
    <figcaption><b>4. Done.</b> The new playlist is named after the Spotify one. Songs not found are listed. "Search" opens Listen with that song typed in, so you can pick one yourself and add it with the three dots.</figcaption>
  </figure>
</div>

<script>
document.querySelectorAll('.chrome').forEach(c => c.replaceWith(document.getElementById('chrome').content.cloneNode(true)));
</script>
</body>
</html>
