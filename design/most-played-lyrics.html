<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spotifry · Most played and lyrics</title>
<style>
@font-face { font-family:"Albert"; src:url("../app/src/main/res/font/albertsans.ttf"); font-weight:400 700; }
:root { --bg:#F4F5F7; --surface:#FFFFFF; --high:#E6E8EC; --outline:#C9CDD3; --ink:#15181C; --ink2:#525A64; --accent:#1F5FD6; --glow:rgba(91,149,255,.5); }
body.dark { --bg:#0C0D10; --surface:#17191E; --high:#1F2228; --outline:#2A2E35; --ink:#F2F3F5; --ink2:#A6ADB6; --accent:#5B95FF; --glow:rgba(91,149,255,.30); }
* { box-sizing:border-box; margin:0; }
body { font-family:"Albert",sans-serif; background:#D9DCE1; color:var(--ink); padding:28px 32px 48px; }
body.dark { background:#050608; }
header.page { display:flex; align-items:baseline; gap:24px; margin-bottom:24px; color:#15181C; }
body.dark header.page, body.dark figcaption { color:#C9CDD3; }
header.page h1 { font-size:22px; letter-spacing:-.02em; }
header.page button { font:600 14px "Albert"; border:1px solid currentColor; background:none; color:inherit; border-radius:99px; padding:6px 14px; cursor:pointer; }
.row { display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start; }
figure { width:360px; } figcaption { font-size:14px; line-height:20px; color:#3A4048; margin-top:12px; max-width:340px; }
.phone { width:360px; height:780px; border-radius:34px; overflow:hidden; position:relative; background:var(--bg); box-shadow:0 18px 40px -12px rgba(0,0,0,.35); }
.phone.home::before { content:""; position:absolute; inset:0 0 auto auto; width:300px; height:260px; background:radial-gradient(closest-side,var(--glow),transparent); transform:translate(30%,-30%); }
.status { height:34px; display:flex; justify-content:space-between; align-items:center; padding:0 22px; font-size:13px; font-weight:600; position:relative; }
.screen { padding:0 20px; position:relative; }
.sec { font-size:21px; font-weight:700; letter-spacing:-.42px; margin:18px 0 12px; }
.cards { display:flex; gap:12px; } .cards div { width:130px; flex:none; } .cards i { display:block; width:130px; height:130px; border-radius:14px; }
.cards b { display:block; font-size:15px; font-weight:600; margin-top:8px; } .cards span { font-size:13px; color:var(--ink2); }
.mp { display:flex; align-items:center; gap:14px; height:62px; }
.mp .n { width:18px; text-align:center; font-weight:700; font-size:17px; color:var(--ink2); }
.mp .art { width:48px; height:48px; border-radius:9px; flex:none; }
.mp .t { flex:1; min-width:0; } .mp b { display:block; font-weight:500; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .mp span { font-size:14px; color:var(--ink2); }
.mp svg { width:22px; height:22px; color:var(--ink2); }
.mini { position:absolute; left:10px; right:10px; bottom:80px; height:62px; border-radius:18px; border:1px solid var(--outline); background:color-mix(in srgb,var(--bg) 88%,transparent); display:flex; align-items:center; gap:12px; padding:0 12px; }
.mini .art { width:42px; height:42px; border-radius:8px; background:#5d5785; } .mini b { font-size:15px; display:block; } .mini span { font-size:13px; color:var(--ink2); }
.nav { position:absolute; left:0; right:0; bottom:0; height:76px; display:flex; justify-content:space-around; align-items:center; font-size:12.5px; color:var(--ink2); background:var(--bg); }
.nav div { display:flex; flex-direction:column; align-items:center; gap:4px; width:25%; } .nav svg { width:22px; height:22px; } .nav .on { color:var(--accent); }

/* now playing: always dark, tinted from the cover */
.np { background:linear-gradient(#3a3550, #16141f 70%); color:#F2F3F5; }
.np .status { color:#fff; }
.np .title { font-size:28px; font-weight:700; letter-spacing:-.56px; margin-top:6px; } .np .artist { font-size:17px; color:#C9C6D6; }
.bar { height:4px; border-radius:4px; background:rgba(255,255,255,.25); margin:18px 0 6px; } .bar i { display:block; width:38%; height:100%; background:#fff; border-radius:4px; }
.times { display:flex; justify-content:space-between; font-size:13px; color:#C9C6D6; }
.ctl { display:flex; justify-content:space-between; align-items:center; margin:12px 4px 18px; }
.ctl svg { width:26px; height:26px; } .ctl .big { width:64px; height:64px; border-radius:50%; background:#fff; color:#111; display:grid; place-items:center; } .ctl .big svg { width:30px; height:30px; }
.card { border-radius:20px; padding:16px 18px; }
.lyr { background:#5a4f86; }
.card .h { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
.card .h b { font-size:18px; } .card .h span { font-size:14px; font-weight:600; color:rgba(255,255,255,.8); }
.lyr p { font-size:19px; line-height:27px; font-weight:700; color:rgba(255,255,255,.45); } .lyr p.now { color:#fff; }
.up { background:rgba(255,255,255,.07); margin-top:12px; }
.up .s { display:flex; gap:12px; align-items:center; height:52px; } .up .s i { width:40px; height:40px; border-radius:8px; } .up .s b { font-weight:500; font-size:15px; display:block; } .up .s span { font-size:13px; color:#C9C6D6; }

.full { background:#5a4f86; color:#fff; }
.full .top { display:flex; align-items:center; gap:12px; padding:8px 16px 0; }
.full .top svg { width:26px; height:26px; flex:none; } .full .top b { display:block; font-size:16px; } .full .top span { font-size:14px; color:rgba(255,255,255,.75); }
.lines { padding:22px 22px 0; }
.lines p { font-size:24px; line-height:32px; font-weight:700; letter-spacing:-.3px; margin-bottom:14px; color:rgba(255,255,255,.5); }
.lines p.past { color:rgba(255,255,255,.7); } .lines p.now { color:#fff; }
.foot { position:absolute; left:0; right:0; bottom:0; padding:18px 22px 26px; background:linear-gradient(transparent,#5a4f86 30%); }
.foot .row2 { display:flex; align-items:center; gap:14px; } .foot .bar { flex:1; margin:0; }
.foot .big { width:48px; height:48px; border-radius:50%; background:#fff; color:#111; display:grid; place-items:center; } .foot .big svg { width:22px; height:22px; }
.foot .times { margin-top:6px; padding-right:62px; }
.src { font-size:12px; color:rgba(255,255,255,.6); margin-top:10px; }
</style>
</head>
<body>
<header class="page"><h1>Most played and lyrics</h1><button onclick="document.body.classList.toggle('dark')">Switch light / dark</button></header>

<svg width="0" height="0" style="position:absolute">
  <symbol id="home" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></symbol>
  <symbol id="search" viewBox="0 0 24 24" fill="currentColor"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></symbol>
  <symbol id="saved" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 4v6.2l2.3-2.3 1.4 1.4L12 16l-3.7-3.7 1.4-1.4 2.3 2.3V7z"/></symbol>
  <symbol id="list" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h14v2H3zm0 5h14v2H3zm0 5h9v2H3zm15-5v5.3a2.7 2.7 0 1 0 2 2.6V8h3V6h-5z"/></symbol>
  <symbol id="more" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></symbol>
  <symbol id="play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></symbol>
  <symbol id="next" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6l9 6-9 6zm10 0h2v12h-2z"/></symbol>
  <symbol id="prev" viewBox="0 0 24 24" fill="currentColor"><path d="M18 6l-9 6 9 6zM6 6h2v12H6z"/></symbol>
  <symbol id="shuffle" viewBox="0 0 24 24" fill="currentColor"><path d="M16 4h5v5l-1.8-1.8L5.4 21 4 19.6 17.8 5.8zM4 4.4 9.5 10 8.1 11.4 2.6 5.8zm10.6 8.2 1.4-1.4 3.2 3.2L21 12.6V18h-5.4l1.8-1.8z"/></symbol>
  <symbol id="repeat" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></symbol>
  <symbol id="down" viewBox="0 0 24 24" fill="currentColor"><path d="M7.4 9 12 13.6 16.6 9 18 10.4l-6 6-6-6z"/></symbol>
</svg>

<div class="row">
  <figure>
    <div class="phone home">
      <div class="status"><span>01.10</span><span>38%</span></div>
      <div class="screen">
        <p class="sec">Recently played</p>
        <div class="cards">
          <div><i style="background:#8a4a5a"></i><b>Kokoronashi</b><span>Shania Yan</span></div>
          <div><i style="background:#4f6d63"></i><b>群青</b><span>YOASOBI</span></div>
          <div><i style="background:#6d8fb0"></i><b>Grenade</b><span>Bruno Mars</span></div>
        </div>
        <p class="sec">Most played</p>
        <div class="mp"><span class="n">1</span><i class="art" style="background:#5d5785"></i><div class="t"><b>Into The Night</b><span>YOASOBI</span></div><svg><use href="#more"/></svg></div>
        <div class="mp"><span class="n">2</span><i class="art" style="background:#8a4a5a"></i><div class="t"><b>Kokoronashi</b><span>Shania Yan</span></div><svg><use href="#more"/></svg></div>
        <div class="mp"><span class="n">3</span><i class="art" style="background:#7a5b37"></i><div class="t"><b>To Whom It May Concern</b><span>Creed</span></div><svg><use href="#more"/></svg></div>
        <div class="mp"><span class="n">4</span><i class="art" style="background:#4f6d63"></i><div class="t"><b>群青</b><span>YOASOBI</span></div><svg><use href="#more"/></svg></div>
        <div class="mp"><span class="n">5</span><i class="art" style="background:#6d8fb0"></i><div class="t"><b>Grenade</b><span>Bruno Mars</span></div><svg><use href="#more"/></svg></div>
      </div>
      <div class="mini"><div class="art"></div><div><b>Into The Night</b><span>YOASOBI</span></div></div>
      <div class="nav"><div class="on"><svg><use href="#home"/></svg>Home</div><div><svg><use href="#search"/></svg>Search</div><div><svg><use href="#saved"/></svg>Saved</div><div><svg><use href="#list"/></svg>Playlists</div></div>
    </div>
    <figcaption><b>1. Home, scrolled down.</b> "Most played" comes after Recently played: your top 5, numbered. A song counts as played once you've listened for 30 seconds, so skipped songs don't count. It shows once there are 5 songs to list. Tapping one plays all 5 in that order.</figcaption>
  </figure>

  <figure>
    <div class="phone np">
      <div class="status"><span>01.10</span><span>38%</span></div>
      <div class="screen">
        <p class="title">Into The Night</p><p class="artist">YOASOBI</p>
        <div class="bar"><i></i></div><div class="times"><span>1:38</span><span>4:19</span></div>
        <div class="ctl"><svg><use href="#shuffle"/></svg><svg><use href="#prev"/></svg><span class="big"><svg><use href="#pause"/></svg></span><svg><use href="#next"/></svg><svg><use href="#repeat"/></svg></div>
        <div class="card lyr">
          <div class="h"><b>Lyrics</b><span>Show all</span></div>
          <p>Just the two of us</p>
          <p class="now">Slipping away into the night</p>
          <p>Hand in hand we keep on running</p>
          <p>Through the city lights</p>
        </div>
        <div class="card up"><div class="h"><b>Coming up</b><span>Open queue</span></div>
          <div class="s"><i style="background:#4f6d63"></i><div><b>群青</b><span>YOASOBI</span></div></div>
        </div>
      </div>
    </div>
    <figcaption><b>2. Now playing, scrolled down.</b> A "Lyrics" card sits between the buttons and Coming up, in a lighter shade of the cover colour. The line being sung is white and the card follows the song. Without timed lyrics it shows the first lines. With no lyrics at all the card isn't shown. (Lyrics in this drawing are made up.)</figcaption>
  </figure>

  <figure>
    <div class="phone full">
      <div class="status"><span>01.11</span><span>38%</span></div>
      <div class="top"><svg><use href="#down"/></svg><div><b>Into The Night</b><span>YOASOBI</span></div></div>
      <div class="lines">
        <p class="past">Hand in hand we keep on running</p>
        <p class="past">Through the city lights</p>
        <p class="now">Every word I never said</p>
        <p>Is ringing in my head</p>
        <p>Like a song that never ends</p>
        <p>Waiting for the dawn</p>
      </div>
      <div class="foot">
        <div class="row2"><div class="bar"><i style="width:46%"></i></div><span class="big"><svg><use href="#pause"/></svg></span></div>
        <div class="times"><span>1:58</span><span>4:19</span></div>
        <p class="src">Lyrics from LRCLIB</p>
      </div>
    </div>
    <figcaption><b>3. "Show all".</b> Full-screen lyrics in the cover colour. The sung line is white, past lines slightly dimmer, and it scrolls by itself. Tap a line to jump there. A slim bar and pause button stay at the bottom; the arrow or back gesture closes it. If the lyrics site is busy: "Couldn't load lyrics" with Try again.</figcaption>
  </figure>
</div>
</body>
</html>
