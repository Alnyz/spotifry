<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Spotifry README banner</title>
<!-- Rendered to .github/assets/banner.jpg: brave --headless --screenshot --window-size=1280,640 --force-device-scale-factor=2 -->
<style>
@font-face { font-family:"Albert"; src:url("../app/src/main/res/font/albertsans.ttf"); font-weight:400 800; }
* { margin:0; box-sizing:border-box; }
html, body { width:1280px; height:640px; overflow:hidden; }
body {
  font-family:"Albert",sans-serif; color:#F2F3F5; position:relative;
  background:
    radial-gradient(640px 520px at 78% 18%, rgba(255,138,61,.34), transparent 70%),
    radial-gradient(520px 420px at 8% 110%, rgba(194,65,12,.20), transparent 70%),
    linear-gradient(160deg, #2B1408 0%, #0C0D10 62%);
}
.copy { position:absolute; left:96px; top:50%; transform:translateY(-50%); width:600px; }
.brand { display:flex; align-items:center; gap:18px; }
.brand img { width:68px; height:68px; border-radius:16px; box-shadow:0 0 0 1px rgba(255,255,255,.08); }
.brand span { font-size:44px; font-weight:700; letter-spacing:-.02em; }
h1 { margin-top:34px; font-size:56px; line-height:1.06; font-weight:700; letter-spacing:-.03em; }
h1 i { font-style:normal; color:#FF8A3D; }
p { margin-top:20px; font-size:21px; line-height:1.45; color:#A6ADB6; max-width:560px; }
.phone {
  position:absolute; right:150px; top:72px; width:330px; height:690px; border-radius:46px;
  background:#050608; padding:11px; box-shadow:0 40px 90px -20px rgba(0,0,0,.7), 0 0 0 1.5px rgba(255,255,255,.10);
}
.phone img { width:100%; height:100%; object-fit:cover; object-position:top; border-radius:36px; display:block; }
</style></head>
<body>
  <div class="copy">
    <div class="brand"><img src="../.github/assets/logo.svg" alt=""><span>Spotifry</span></div>
    <h1>Music, simply<i>.</i></h1>
    <p>A simple, clean and modern music player for Android.</p>
  </div>
  <div class="phone"><img src="../.github/assets/screens/home.jpg" alt=""></div>
</body></html>
