<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spotifry · Search and order in a playlist</title>
<style>
@font-face { font-family:"Albert"; src:url("../app/src/main/res/font/albertsans.ttf"); font-weight:400 700; }
:root { --bg:#F4F5F7; --surface:#FFFFFF; --high:#E6E8EC; --outline:#C9CDD3; --ink:#15181C; --ink2:#525A64; --accent:#1F5FD6; --onacc:#fff; --glow:rgba(91,149,255,.5); }
body.dark { --bg:#0C0D10; --surface:#17191E; --high:#1F2228; --outline:#2A2E35; --ink:#F2F3F5; --ink2:#A6ADB6; --accent:#5B95FF; --onacc:#0C0D10; --glow:rgba(91,149,255,.30); }
* { box-sizing:border-box; margin:0; }
body { font-family:"Albert",sans-serif; background:#D9DCE1; color:var(--ink); padding:28px 32px 48px; }
body.dark { background:#050608; }
header.page { display:flex; align-items:baseline; gap:24px; margin-bottom:24px; color:#15181C; }
body.dark header.page, body.dark figcaption { color:#C9CDD3; }
header.page h1 { font-size:22px; letter-spacing:-.02em; }
header.page button { font:600 14px "Albert"; border:1px solid currentColor; background:none; color:inherit; border-radius:99px; padding:6px 14px; cursor:pointer; }
.row { display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start; }
figure { width:360px; } figcaption { font-size:14px; line-height:20px; color:#3A4048; margin-top:12px; max-width:340px; }
.phone { width:360px; height:780px; border-radius:34px; overflow:hidden; position:relative; background:var(--bg); box-shadow:0 18px 40px -12px rgba(0,0,0,.35); }
.phone::before { content:""; position:absolute; inset:0 0 auto auto; width:300px; height:260px; background:radial-gradient(closest-side,var(--glow),transparent); transform:translate(30%,-30%); }
.status { height:34px; display:flex; justify-content:space-between; align-items:center; padding:0 22px; font-size:13px; font-weight:600; position:relative; }
.screen { padding:0 20px; position:relative; }
.top { display:flex; justify-content:space-between; align-items:center; height:48px; margin-left:-12px; margin-right:-12px; }
.ib { width:48px; height:48px; display:grid; place-items:center; } .ib svg { width:24px; height:24px; }
h2.t { font-size:36px; font-weight:700; letter-spacing:-.7px; line-height:44px; }
.sub { font-size:16px; color:var(--ink2); margin-top:4px; }
.btns { display:flex; gap:10px; margin-top:16px; }
.pill { height:48px; border-radius:99px; display:inline-flex; align-items:center; gap:8px; padding:0 20px 0 16px; font-size:14px; font-weight:600; background:var(--surface); }
.pill.p { background:var(--accent); color:var(--onacc); } .pill svg { width:20px; height:20px; }
.tools { display:flex; gap:10px; margin:14px 0 6px; align-items:center; }
.search { flex:1; height:48px; border-radius:99px; background:var(--surface); display:flex; align-items:center; gap:10px; padding:0 16px; font-size:15px; color:var(--ink2); }
.search svg { width:20px; height:20px; flex:none; } .search b { color:var(--ink); font-weight:400; flex:1; } .search .x { margin-left:auto; }
.sortb { height:48px; border-radius:99px; background:var(--surface); display:flex; align-items:center; gap:6px; padding:0 14px 0 12px; font-size:14px; font-weight:600; white-space:nowrap; }
.sortb svg { width:20px; height:20px; }
.found { font-size:13px; color:var(--ink2); margin:6px 0 2px; }
.song { display:flex; align-items:center; gap:14px; height:70px; }
.song i { width:52px; height:52px; border-radius:10px; flex:none; }
.song .x { flex:1; min-width:0; } .song b { display:block; font-weight:500; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .song span { font-size:14px; color:var(--ink2); }
.song mark { background:color-mix(in srgb,var(--accent) 22%,transparent); color:inherit; border-radius:3px; padding:0 1px; }
.song svg { width:22px; height:22px; color:var(--ink2); flex:none; }
.song.lift { background:var(--surface); border-radius:14px; margin:0 -10px; padding:0 10px; box-shadow:0 10px 24px -8px rgba(0,0,0,.35); }
.mini { position:absolute; left:10px; right:10px; bottom:80px; height:62px; border-radius:18px; border:1px solid var(--outline); background:color-mix(in srgb,var(--bg) 88%,transparent); display:flex; align-items:center; gap:12px; padding:0 12px; }
.mini .art { width:42px; height:42px; border-radius:8px; background:#5d5785; } .mini b { font-size:15px; display:block; } .mini span { font-size:13px; color:var(--ink2); }
.nav { position:absolute; left:0; right:0; bottom:0; height:76px; display:flex; justify-content:space-around; align-items:center; font-size:12.5px; color:var(--ink2); background:var(--bg); }
.nav div { display:flex; flex-direction:column; align-items:center; gap:4px; width:25%; } .nav svg { width:22px; height:22px; } .nav .on { color:var(--accent); }
.menu { position:absolute; right:20px; top:262px; width:220px; background:var(--surface); border-radius:16px; padding:8px 0; box-shadow:0 14px 34px -10px rgba(0,0,0,.45); }
.menu p { height:48px; display:flex; align-items:center; gap:12px; padding:0 16px; font-size:15px; }
.menu p svg { width:20px; height:20px; } .menu p.on { color:var(--accent); font-weight:600; } .menu p .sp { width:20px; }
.menu hr { border:0; height:1px; background:var(--outline); margin:6px 0; }
.editbar { display:flex; align-items:center; justify-content:space-between; height:56px; }
.editbar b { font-size:20px; } .done { height:40px; padding:0 18px; border-radius:99px; background:var(--accent); color:var(--onacc); font-weight:600; font-size:14px; display:grid; place-items:center; }
.hint { font-size:14px; color:var(--ink2); margin-bottom:6px; }
.kb { position:absolute; left:0; right:0; bottom:0; height:250px; background:var(--high); display:grid; place-items:center; font-size:13px; color:var(--ink2); }
</style>
</head>
<body>
<header class="page"><h1>Search and order in a playlist</h1><button onclick="document.body.classList.toggle('dark')">Switch light / dark</button></header>

<svg width="0" height="0" style="position:absolute">
  <symbol id="back" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></symbol>
  <symbol id="more" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></symbol>
  <symbol id="play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="shuffle" viewBox="0 0 24 24" fill="currentColor"><path d="M16 4h5v5l-1.8-1.8L5.4 21 4 19.6 17.8 5.8zM4 4.4 9.5 10 8.1 11.4 2.6 5.8zm10.6 8.2 1.4-1.4 3.2 3.2L21 12.6V18h-5.4l1.8-1.8z"/></symbol>
  <symbol id="search" viewBox="0 0 24 24" fill="currentColor"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></symbol>
  <symbol id="sort" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm3 5h12v2H6zm4 5h4v2h-4z"/></symbol>
  <symbol id="x" viewBox="0 0 24 24" fill="currentColor"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/></symbol>
  <symbol id="check" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></symbol>
  <symbol id="drag" viewBox="0 0 24 24" fill="currentColor"><path d="M4 8h16v2H4zm0 6h16v2H4z"/></symbol>
  <symbol id="edit" viewBox="0 0 24 24" fill="currentColor"><path d="M8 3 4 7h3v8h2V7h3zm9 6h-2v8h-3l4 4 4-4h-3z"/></symbol>
  <symbol id="home" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></symbol>
  <symbol id="saved" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 4v6.2l2.3-2.3 1.4 1.4L12 16l-3.7-3.7 1.4-1.4 2.3 2.3V7z"/></symbol>
  <symbol id="list" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h14v2H3zm0 5h14v2H3zm0 5h9v2H3zm15-5v5.3a2.7 2.7 0 1 0 2 2.6V8h3V6h-5z"/></symbol>
</svg>

<div class="row">
  <figure>
    <div class="phone">
      <div class="status"><span>15.20</span><span>66%</span></div>
      <div class="screen">
        <div class="top"><span class="ib"><svg><use href="#back"/></svg></span><span class="ib"><svg><use href="#more"/></svg></span></div>
        <h2 class="t">chill</h2><p class="sub">98 songs · 2 saved</p>
        <div class="btns"><span class="pill p"><svg><use href="#play"/></svg>Play</span><span class="pill"><svg><use href="#shuffle"/></svg>Shuffle</span></div>
        <div class="tools">
          <div class="search"><svg><use href="#search"/></svg>Search in chill</div>
          <div class="sortb"><svg><use href="#sort"/></svg>Your order</div>
        </div>
        <div class="song"><i style="background:#6d8fb0"></i><div class="x"><b>Paper Lanterns</b><span>The Night Owls</span></div><svg><use href="#more"/></svg></div>
        <div class="song"><i style="background:#8a4a5a"></i><div class="x"><b>Slow Tide</b><span>Mara Lune</span></div><svg><use href="#more"/></svg></div>
        <div class="song"><i style="background:#4f6d63"></i><div class="x"><b>Love in Low Light</b><span>Kite Harbor</span></div><svg><use href="#more"/></svg></div>
        <div class="song"><i style="background:#7a5b37"></i><div class="x"><b>Copper Rooftops</b><span>Ellis Gray</span></div><svg><use href="#more"/></svg></div>
      </div>
      <div class="mini"><div class="art"></div><div><b>Paper Lanterns</b><span>The Night Owls</span></div></div>
      <div class="nav"><div><svg><use href="#home"/></svg>Home</div><div><svg><use href="#search"/></svg>Search</div><div><svg><use href="#saved"/></svg>Saved</div><div class="on"><svg><use href="#list"/></svg>Playlists</div></div>
    </div>
    <figcaption><b>1. Playlist page.</b> Under Play and Shuffle there's a new row: a search box ("Search in chill") and an order button that shows the order in use. Shuffle already plays in random order and stays as it is.</figcaption>
  </figure>

  <figure>
    <div class="phone">
      <div class="status"><span>15.20</span><span>66%</span></div>
      <div class="screen">
        <div class="top"><span class="ib"><svg><use href="#back"/></svg></span><span class="ib"><svg><use href="#more"/></svg></span></div>
        <h2 class="t">chill</h2><p class="sub">98 songs · 2 saved</p>
        <div class="tools">
          <div class="search"><svg><use href="#search"/></svg><b>love</b><svg class="x"><use href="#x"/></svg></div>
        </div>
        <p class="found">3 of 98 songs</p>
        <div class="song"><i style="background:#4f6d63"></i><div class="x"><b><mark>Love</mark> in Low Light</b><span>Kite Harbor</span></div><svg><use href="#more"/></svg></div>
        <div class="song"><i style="background:#5d5785"></i><div class="x"><b>Glass <mark>Love</mark>rs</b><span>Juniper Field</span></div><svg><use href="#more"/></svg></div>
        <div class="song"><i style="background:#6d8fb0"></i><div class="x"><b>Midnight Ferry</b><span>The <mark>Love</mark>ly Hours</span></div><svg><use href="#more"/></svg></div>
      </div>
      <div class="kb">keyboard</div>
    </div>
    <figcaption><b>2. Searching.</b> Typing filters the list at once, by song name or artist, with the match lightly marked. Play and Shuffle hide while you search so the results get the room. Tap a song and it plays from there, followed by the rest of the playlist. The × clears the search.</figcaption>
  </figure>

  <figure>
    <div class="phone">
      <div class="status"><span>15.21</span><span>66%</span></div>
      <div class="screen">
        <div class="top"><span class="ib"><svg><use href="#back"/></svg></span><span class="ib"><svg><use href="#more"/></svg></span></div>
        <h2 class="t">chill</h2><p class="sub">98 songs · 2 saved</p>
        <div class="btns"><span class="pill p"><svg><use href="#play"/></svg>Play</span><span class="pill"><svg><use href="#shuffle"/></svg>Shuffle</span></div>
        <div class="tools">
          <div class="search"><svg><use href="#search"/></svg>Search in chill</div>
          <div class="sortb"><svg><use href="#sort"/></svg>Your order</div>
        </div>
        <div class="song"><i style="background:#6d8fb0"></i><div class="x"><b>Paper Lanterns</b><span>The Night Owls</span></div><svg><use href="#more"/></svg></div>
        <div class="song"><i style="background:#8a4a5a"></i><div class="x"><b>Slow Tide</b><span>Mara Lune</span></div><svg><use href="#more"/></svg></div>
      </div>
      <div class="menu">
        <p class="on"><svg><use href="#check"/></svg>Your order</p>
        <p><span class="sp"></span>Recently added</p>
        <p><span class="sp"></span>Song name A–Z</p>
        <p><span class="sp"></span>Artist A–Z</p>
        <hr>
        <p><svg><use href="#edit"/></svg>Change your order</p>
        <p><svg><use href="#shuffle"/></svg>Mix up your order</p>
      </div>
      <div class="mini"><div class="art"></div><div><b>Paper Lanterns</b><span>The Night Owls</span></div></div>
      <div class="nav"><div><svg><use href="#home"/></svg>Home</div><div><svg><use href="#search"/></svg>Search</div><div><svg><use href="#saved"/></svg>Saved</div><div class="on"><svg><use href="#list"/></svg>Playlists</div></div>
    </div>
    <figcaption><b>3. Order.</b> The order button opens a short menu: your own order (the order songs were added or imported in, unless you change it), recently added, song name or artist. Play follows the order you pick, and each playlist remembers its own. "Change your order" opens 4.<br><br><b>"Mix up your order"</b> puts the songs in a new random order and saves it, without playing anything. Next time you open the playlist it's still in that order, and Play goes through it top to bottom. A bar at the bottom says "Order mixed up" with <b>Undo</b> for a few seconds, in case you had a hand-made order you wanted to keep.</figcaption>
  </figure>

  <figure>
    <div class="phone">
      <div class="status"><span>15.21</span><span>66%</span></div>
      <div class="screen">
        <div class="editbar"><b>Change order</b><span class="done">Done</span></div>
        <p class="hint">Hold a song and drag it up or down.</p>
        <div class="song"><i style="background:#6d8fb0"></i><div class="x"><b>Paper Lanterns</b><span>The Night Owls</span></div><svg><use href="#drag"/></svg></div>
        <div class="song lift"><i style="background:#4f6d63"></i><div class="x"><b>Love in Low Light</b><span>Kite Harbor</span></div><svg><use href="#drag"/></svg></div>
        <div class="song"><i style="background:#8a4a5a"></i><div class="x"><b>Slow Tide</b><span>Mara Lune</span></div><svg><use href="#drag"/></svg></div>
        <div class="song"><i style="background:#7a5b37"></i><div class="x"><b>Copper Rooftops</b><span>Ellis Gray</span></div><svg><use href="#drag"/></svg></div>
        <div class="song"><i style="background:#5d5785"></i><div class="x"><b>Glass Lovers</b><span>Juniper Field</span></div><svg><use href="#drag"/></svg></div>
        <div class="song"><i style="background:#3f5b78"></i><div class="x"><b>Midnight Ferry</b><span>The Lovely Hours</span></div><svg><use href="#drag"/></svg></div>
        <div class="song"><i style="background:#6a4a72"></i><div class="x"><b>Quiet Engines</b><span>Northbound</span></div><svg><use href="#drag"/></svg></div>
      </div>
      <div class="nav"><div><svg><use href="#home"/></svg>Home</div><div><svg><use href="#search"/></svg>Search</div><div><svg><use href="#saved"/></svg>Saved</div><div class="on"><svg><use href="#list"/></svg>Playlists</div></div>
    </div>
    <figcaption><b>4. Change your order.</b> Each song gets a handle on the right. Hold a song and drag it; the list scrolls by itself near the top and bottom edges, so moving a song far down a 98-song list works. Done (or back) saves, and the order button switches to "Your order".</figcaption>
  </figure>
</div>
</body>
</html>
