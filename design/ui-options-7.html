<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Music: redesign from reference, red vs blue</title>
<style>
@font-face { font-family: Albert; src: url(../app/src/main/res/font/albertsans.ttf); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #2a2c31; font-family: Albert, sans-serif; color: #F2F3F5; padding: 32px; }
h1.page { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
p.page { color: #b8bcc4; font-size: 14px; margin-bottom: 18px; }
h2.row { font-size: 15px; font-weight: 600; margin: 28px 0 12px; color: #d8dbe0; }
.strip { display: flex; gap: 28px; flex-wrap: wrap; }
.cap { font-size: 13px; color: #b8bcc4; margin-top: 8px; }

.phone { width: 390px; height: 844px; border-radius: 36px; overflow: hidden; position: relative;
  background: var(--ground); box-shadow: 0 18px 40px rgba(0,0,0,.45); }
.red  { --accent: #EF3E45; --accentInk: #fff; --glow: 239,62,69;  --tint: #3a1519; }
.blue { --accent: #4C8DFF; --accentInk: #fff; --glow: 76,141,255; --tint: #13223f; }
.phone { --ground: #0C0D10; --surface: #17191E; --surface2: #1F2228; --line: #262A31; --text: #F2F3F5; --muted: #A3A9B2; }

.glow { position: absolute; inset: 0 0 auto 0; height: 360px; pointer-events: none;
  background: radial-gradient(70% 60% at 85% 0%, rgba(var(--glow), .38), transparent 70%); }
.status { height: 40px; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; font-size: 14px; font-weight: 600; position: relative; }
.scroll { position: absolute; top: 40px; left: 0; right: 0; bottom: 0; overflow: hidden; padding-bottom: 170px; }
.pad { padding: 0 20px; }

.hello { color: var(--muted); font-size: 20px; margin-top: 18px; }
.name { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; }
.name i { font-style: normal; color: var(--accent); }
.search { margin-top: 18px; height: 52px; border-radius: 26px; background: rgba(255,255,255,.06); border: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding: 0 18px; color: var(--muted); font-size: 15px; }

.hero { margin-top: 18px; height: 212px; border-radius: 22px; overflow: hidden; position: relative; background-size: cover; background-position: center; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,9,12,.92) 0%, rgba(8,9,12,.55) 55%, rgba(8,9,12,.15) 100%); }
.hero > * { position: relative; z-index: 1; }
.hero .in { padding: 18px 20px; height: 100%; display: flex; flex-direction: column; }
.pill { align-self: flex-start; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 12px; background: rgba(255,255,255,.14); }
.hero h3 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; margin-top: 12px; }
.hero .by { color: #d0d4da; font-size: 15px; margin-top: 6px; }
.hero .act { margin-top: auto; display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 15px; }
.circle { width: 48px; height: 48px; border-radius: 50%; background: #fff; color: #0C0D10; display: grid; place-items: center; flex: none; }

.chips { display: flex; gap: 10px; margin-top: 16px; }
.chip { flex: 1; height: 56px; border-radius: 28px; background: var(--surface); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 500; }
.chip svg { color: var(--accent); }

.sec { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 20px 12px; }
.sec h4 { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
.sec span { color: var(--muted); font-size: 14px; }
.cards { display: flex; gap: 14px; padding-left: 20px; }
.card { width: 140px; flex: none; }
.card .art { width: 140px; height: 140px; border-radius: 14px; background-size: cover; background-position: center; position: relative; }
.card .art .mini { position: absolute; right: 8px; bottom: 8px; width: 34px; height: 34px; border-radius: 50%; background: rgba(12,13,16,.72); display: grid; place-items: center; }
.card b { display: block; font-size: 15px; font-weight: 600; margin-top: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card small { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }

.mix { margin: 0 20px; height: 86px; border-radius: 20px; background: linear-gradient(100deg, var(--tint), var(--surface) 75%); display: flex; align-items: center; gap: 14px; padding: 0 16px; }
.mix .art { width: 54px; height: 54px; border-radius: 10px; background-size: cover; flex: none; }
.mix div.t { flex: 1; }
.mix b { display: block; font-size: 16px; font-weight: 600; }
.mix small { font-size: 13px; color: var(--muted); }
.mix .circle { width: 44px; height: 44px; background: var(--accent); color: var(--accentInk); }

.miniplayer { position: absolute; left: 10px; right: 10px; bottom: 84px; height: 66px; border-radius: 18px;
  background: rgba(24,26,31,.82); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,.07);
  display: flex; align-items: center; gap: 12px; padding: 0 10px; overflow: hidden; }
.miniplayer .art { width: 46px; height: 46px; border-radius: 9px; background-size: cover; flex: none; }
.miniplayer .t { flex: 1; min-width: 0; }
.miniplayer b { display: block; font-size: 15px; font-weight: 600; }
.miniplayer small { color: var(--muted); font-size: 13px; }
.miniplayer .ic { width: 44px; height: 44px; display: grid; place-items: center; }
.miniplayer .prog { position: absolute; left: 0; bottom: 0; height: 2px; width: 38%; background: var(--accent); }
.nav { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: var(--ground); display: flex; padding-bottom: 14px; }
.nav a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; }
.nav a.on { color: var(--accent); font-weight: 600; }

/* list screens */
.title { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin-top: 22px; }
.sub { color: var(--muted); font-size: 15px; margin-top: 4px; }
.btns { display: flex; gap: 10px; margin-top: 16px; }
.btn { height: 46px; padding: 0 20px; border-radius: 23px; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
.btn.fill { background: var(--accent); color: var(--accentInk); }
.btn.ghost { background: var(--surface); }
.row { display: flex; align-items: center; gap: 14px; height: 70px; padding: 0 12px 0 20px; }
.row .art { width: 52px; height: 52px; border-radius: 10px; background-size: cover; background-position: center; flex: none; }
.row .t { flex: 1; min-width: 0; }
.row b { display: block; font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row small { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 5px; }
.row small svg { color: var(--accent); }
.row .d { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.row .ic { width: 40px; height: 44px; display: grid; place-items: center; color: var(--muted); }
.row.on b { color: var(--accent); }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 14px; padding: 18px 20px 0; }
.tile .mos { aspect-ratio: 1; border-radius: 16px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; }
.tile .mos div { background-size: cover; background-position: center; }
.tile .mos.one { grid-template-columns: 1fr; }
.tile .mos.empty { background: var(--surface); display: grid; place-items: center; color: var(--muted); }
.tile b { display: block; font-size: 16px; font-weight: 600; margin-top: 9px; }
.tile small { color: var(--muted); font-size: 13px; }
.fab { position: absolute; right: 18px; bottom: 166px; height: 54px; padding: 0 20px; border-radius: 27px; background: var(--accent); color: var(--accentInk);
  display: flex; align-items: center; gap: 8px; font-weight: 600; box-shadow: 0 8px 20px rgba(0,0,0,.4); }

/* now playing */
.np { position: absolute; inset: 0; }
.np .wash { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(60px) saturate(1.2); opacity: .45; transform: scale(1.3); }
.np .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12,13,16,.35) 0%, rgba(12,13,16,.75) 55%, var(--ground) 100%); }
.np .top { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; height: 56px; }
.np .top span { font-size: 14px; font-weight: 600; color: #d0d4da; }
.np .cover { position: relative; margin: 14px auto 0; width: 330px; height: 330px; border-radius: 22px; background-size: cover; box-shadow: 0 24px 48px rgba(0,0,0,.5); }
.np .meta { position: relative; padding: 24px 30px 0; display: flex; align-items: flex-end; gap: 12px; }
.np .meta div { flex: 1; }
.np h3 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
.np .meta small { color: #c3c8cf; font-size: 16px; }
.np .save { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.1); display: grid; place-items: center; }
.panel { position: absolute; left: 10px; right: 10px; bottom: 26px; border-radius: 26px; padding: 20px 20px 14px;
  background: rgba(22,24,29,.72); backdrop-filter: blur(28px); border: 1px solid rgba(255,255,255,.08); }
.bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); position: relative; }
.bar::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 34%; background: var(--accent); border-radius: 2px; }
.bar::after { content: ""; position: absolute; left: 34%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #fff; }
.times { display: flex; justify-content: space-between; font-size: 12px; color: #b9bec6; margin-top: 8px; font-variant-numeric: tabular-nums; }
.ctl { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
.ctl .ic { width: 48px; height: 48px; display: grid; place-items: center; }
.ctl .big { width: 72px; height: 72px; border-radius: 50%; background: var(--accent); color: var(--accentInk); display: grid; place-items: center; }
.panel .foot { display: flex; justify-content: space-between; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.08); font-size: 14px; color: #d0d4da; }
.panel .foot span { display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>
<h1 class="page">Redesign from your reference: red vs blue</h1>
<p class="page">Same layout in both rows, only the accent changes. Songs and covers are from your own play history on the phone. Playlist names are examples. Glass is only on the mini player and the Now playing controls.</p>
<div id="out"></div>

<script>
const yt3 = id => `https://yt3.googleusercontent.com/${id}=w544-h544-l90-rj`;
const S = {
  lodi:   { t: "Lodi When", a: "Zach Bryan", d: "3:57", img: yt3("H7_M9Flq-y8fLN8gTr5BX7LPpsYiQqQ55J0ujJuS8Y29fQzIWUKtqQOHguSEsJ7Q-dQtKBQZpm7MLRgR") },
  celine: { t: "It's All Coming Back to Me Now", a: "Celine Dion", d: "7:37", img: "https://i.ytimg.com/vi/JsWG2Gry1fw/mqdefault.jpg" },
  roses:  { t: "Bed Of Roses", a: "Bon Jovi", d: "6:35", img: yt3("s-Yt3elXNCm7-IopF9mVq7NpGLZ5o33js7GDBJBzCfMJ5SDSQFArHZU1-B-jZkWzBnnDAObuR9oJ6ECk2g"), saved: true },
  kripa:  { t: "Aesi Kripa Karo-Lofi", a: "Pawan Brijwasi", d: "7:00", img: yt3("nHyU88XOjd9j9pW_-L2hAjxy8XN8ZReyiA8JazsfzWIHn-UFi3-NkpzR1RsT1C8HbmSAupgjds_4quk") },
  chill:  { t: "Lofi Chill", a: "Sad Music", d: "5:42", img: yt3("0bb5M66hQ4fXd277Bjxg2WJJIny9eUoT1vT0IdqwwYb4Prjt4oVS4t9NR6KdBrXpsrKN2hnNBpzYCkY3") },
  always: { t: "Always", a: "Bon Jovi", d: "5:54", img: "https://i.ytimg.com/vi/5Ot4n64Jpbw/mqdefault.jpg", saved: true },
  tujaane:{ t: "Tu Jaane Naa: Lofi Mix", a: "Pritam", d: "5:39", img: yt3("fffI-F3w6es5j0ps83KAuqlHcu-PQwyJCOzd1N09UVS0v0F2FvG6hTdt2ZErYXWioHs_tEl0P7BX6TA") },
  gangsta:{ t: "Gangsta's Paradise", a: "Lofi Fruits Music", d: "1:56", img: yt3("_b4G33CL0fQW1kEHQz56DBUgCH7_PDIOZAxg2-RJE-0iThfP_Ev0WS12wd6-xnEgRWozXpHDyx4-WRLW") },
};
const bg = s => `style="background-image:url('${s.img}')"`;
const ico = (p, s = 22, fill = false) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${fill ? "currentColor" : "none"}" stroke="${fill ? "none" : "currentColor"}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  play: '<path d="M8 5.5v13l11-6.5z"/>',
  pause: '<rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/>',
  next: '<path d="M6 5.5v13l9-6.5z"/><rect x="16" y="5.5" width="2.4" height="13" rx="1"/>',
  prev: '<path d="M18 5.5v13l-9-6.5z"/><rect x="5.6" y="5.5" width="2.4" height="13" rx="1"/>',
  down: '<path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/>',
  list: '<path d="M4 6h12M4 12h12M4 18h8"/><path d="M19 15v6M16 18h6"/>',
  shuffle: '<path d="M16 4h4v4"/><path d="M4 20 20 4"/><path d="M20 16v4h-4"/><path d="m15 15 5 5"/><path d="m4 4 5 5"/>',
  repeat: '<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/>',
  more: '<circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  home: '<path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
  saved: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v8M8.5 12.5 12 16l3.5-3.5"/>',
  lists: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  radio: '<path d="M4 12h2l2-6 3 12 3-9 2 3h4"/>',
  queue: '<path d="M4 6h12M4 12h12M4 18h7"/><path d="M16 15v6l5-3z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
};
const status = () => `<div class="status"><span>22:56</span><span>▮▮ 39%</span></div>`;
const nav = on => `<div class="nav">${[["Listen","home"],["Saved","saved"],["Playlists","lists"]].map(([l,i]) => `<a class="${l===on?"on":""}">${ico(I[i],24)}${l}</a>`).join("")}</div>`;
const mini = (s, playing = true) => `<div class="miniplayer"><div class="art" ${bg(s)}></div><div class="t"><b>${s.t}</b><small>${s.a}</small></div><div class="ic">${ico(playing?I.pause:I.play,24,true)}</div><div class="ic">${ico(I.next,24,true)}</div><div class="prog"></div></div>`;
const row = (s, on = false) => `<div class="row ${on?"on":""}"><div class="art" ${bg(s)}></div><div class="t"><b>${s.t}</b><small>${s.saved?ico(I.down,14):""}${s.a}</small></div><span class="d">${s.d}</span><span class="ic">${ico(I.more,20)}</span></div>`;

const listen = () => `<div class="glow"></div>${status()}<div class="scroll"><div class="pad">
  <div class="hello">Good evening,</div><div class="name">Alnyz<i>.</i></div>
  <div class="search">${ico(I.search)}Search songs or artists</div>
  <div class="hero" ${bg(S.lodi)}><div class="in"><span class="pill">Last played</span><h3>Lodi When</h3><div class="by">Zach Bryan</div>
    <div class="act"><span class="circle">${ico(I.play,24,true)}</span>Play again</div></div></div>
  <div class="chips"><div class="chip">${ico(I.down,20)}Saved</div><div class="chip">${ico(I.lists,20)}Playlists</div><div class="chip">${ico(I.shuffle,20)}Shuffle</div></div>
  </div>
  <div class="sec"><h4>Recently played</h4></div>
  <div class="cards">${[S.celine,S.roses,S.kripa].map(s => `<div class="card"><div class="art" ${bg(s)}><span class="mini">${ico(I.play,16,true)}</span></div><b>${s.t}</b><small>${s.a}</small></div>`).join("")}</div>
  <div class="sec"><h4>Keep listening</h4></div>
  <div class="mix"><div class="art" ${bg(S.lodi)}></div><div class="t"><b>Mix from Lodi When</b><small>Plays it, then similar songs</small></div><span class="circle">${ico(I.radio,22)}</span></div>
</div>${mini(S.lodi)}${nav("Listen")}`;

const nowplaying = () => `<div class="np"><div class="wash" ${bg(S.lodi)}></div><div class="shade"></div>${status()}
  <div class="top">${ico(I.chev,26)}<span>Playing from Last played</span>${ico(I.more,22)}</div>
  <div class="cover" ${bg(S.lodi)}></div>
  <div class="meta"><div><h3>Lodi When</h3><small>Zach Bryan</small></div><span class="save">${ico(I.down,22)}</span></div>
  <div class="panel"><div class="bar"></div><div class="times"><span>1:21</span><span>3:57</span></div>
    <div class="ctl"><span class="ic">${ico(I.shuffle,22)}</span><span class="ic">${ico(I.prev,28,true)}</span><span class="big">${ico(I.pause,32,true)}</span><span class="ic">${ico(I.next,28,true)}</span><span class="ic">${ico(I.repeat,22)}</span></div>
    <div class="foot"><span>${ico(I.down,18)}Save on this phone</span><span>${ico(I.queue,18)}Up next</span></div></div></div>`;

const saved = () => `<div class="glow"></div>${status()}<div class="scroll"><div class="pad">
  <div class="title">Saved</div><div class="sub">2 songs · plays without internet</div>
  <div class="btns"><span class="btn fill">${ico(I.play,20,true)}Play</span><span class="btn ghost">${ico(I.shuffle,20)}Shuffle</span></div></div>
  <div style="height:12px"></div>${row(S.roses, true)}${row(S.always)}
</div>${mini(S.roses)}${nav("Saved")}`;

const playlists = () => `<div class="glow"></div>${status()}<div class="scroll"><div class="pad"><div class="title">Playlists</div><div class="sub">2 playlists</div></div>
  <div class="grid">
    <div class="tile"><div class="mos">${[S.lodi,S.kripa,S.tujaane,S.gangsta].map(s=>`<div ${bg(s)}></div>`).join("")}</div><b>Evening lofi</b><small>4 songs · 0 saved</small></div>
    <div class="tile"><div class="mos one"><div ${bg(S.roses)}></div></div><b>Bon Jovi</b><small>2 songs · 2 saved</small></div>
  </div></div>
  <div class="fab">${ico(I.plus,22)}New playlist</div>${mini(S.lodi)}${nav("Playlists")}`;

const screens = [["Listen", listen], ["Now playing", nowplaying], ["Saved", saved], ["Playlists", playlists]];
document.getElementById("out").innerHTML = ["red", "blue"].map(c => `<h2 class="row">${c === "red" ? "Red accent" : "Blue accent"}</h2><div class="strip">${
  screens.map(([n, f]) => `<div><div class="phone ${c}">${f()}</div><div class="cap">${n}</div></div>`).join("")}</div>`).join("");
</script>
</body>
</html>
