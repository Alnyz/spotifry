<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spotifry · Update notice</title>
<style>
@font-face { font-family:"Albert"; src:url("../app/src/main/res/font/albertsans.ttf"); font-weight:400 700; }
:root { --bg:#F4F5F7; --surface:#FFFFFF; --high:#E6E8EC; --line:#E1E4E8; --outline:#C9CDD3; --ink:#15181C; --ink2:#525A64; --accent:#1F5FD6; --on:#fff; --glow:rgba(91,149,255,.5); --error:#B3261E; }
body.dark { --bg:#0C0D10; --surface:#17191E; --high:#1F2228; --line:#1F2228; --outline:#2A2E35; --ink:#F2F3F5; --ink2:#A6ADB6; --accent:#5B95FF; --on:#08152E; --glow:rgba(91,149,255,.30); --error:#F2877A; }
* { box-sizing:border-box; margin:0; }
body { font-family:"Albert",sans-serif; background:#D9DCE1; color:var(--ink); padding:28px 32px 48px; }
body.dark { background:#050608; }
header.page { display:flex; align-items:baseline; gap:24px; margin-bottom:24px; color:#15181C; }
body.dark header.page, body.dark figcaption { color:#C9CDD3; }
header.page h1 { font-size:22px; letter-spacing:-.02em; }
header.page button { font:600 14px "Albert"; border:1px solid currentColor; background:none; color:inherit; border-radius:99px; padding:6px 14px; cursor:pointer; }
.row { display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start; }
figure { width:360px; } figcaption { font-size:14px; line-height:20px; color:#3A4048; margin-top:12px; max-width:340px; }
.phone { width:360px; height:780px; border-radius:34px; overflow:hidden; position:relative; background:var(--bg); box-shadow:0 18px 40px -12px rgba(0,0,0,.35); }
.phone::before { content:""; position:absolute; inset:0 0 auto auto; width:300px; height:260px; background:radial-gradient(closest-side,var(--glow),transparent); transform:translate(30%,-30%); }
.status { height:34px; display:flex; justify-content:space-between; align-items:center; padding:0 22px; font-size:13px; font-weight:600; position:relative; }
.screen { padding:0 20px; position:relative; }
.greet { display:flex; justify-content:space-between; align-items:center; margin:16px 0 14px; }
.greet h2 { font-size:34px; letter-spacing:-.68px; } .greet h2 i { color:var(--accent); font-style:normal; }
.gear { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--surface); }
.gear svg { width:22px; height:22px; }
.banner { height:200px; border-radius:22px; background:linear-gradient(160deg,#5d5785,#1b1930); color:#fff; padding:18px; }
.banner span.tag { font-size:12px; font-weight:600; background:rgba(0,0,0,.35); padding:4px 10px; border-radius:99px; }
.banner b { display:block; font-size:28px; margin-top:12px; } .banner span { font-size:15px; opacity:.85; }
.chips { display:flex; gap:8px; margin-top:14px; } .chip { flex:1; height:46px; border-radius:99px; background:var(--surface); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; }
.top { display:flex; align-items:center; gap:6px; padding:4px 8px 0; } .top svg { width:24px; height:24px; } .top .b { width:48px; height:48px; display:grid; place-items:center; }
h2.title { font-size:34px; letter-spacing:-.68px; font-weight:700; margin:4px 20px 8px; }
.group { font-size:13px; font-weight:700; color:var(--ink2); margin:18px 20px 6px; letter-spacing:.02em; }
.card { margin:0 12px; background:var(--surface); border-radius:18px; overflow:hidden; }
.item { display:flex; align-items:center; gap:14px; padding:12px 16px; min-height:60px; border-top:1px solid var(--line); }
.item:first-child { border-top:0; }
.item .t { flex:1; } .item b { display:block; font-weight:500; font-size:16px; } .item span { font-size:13px; color:var(--ink2); }
.item .val { font-size:14px; font-weight:600; color:var(--accent); }
.item.danger b { color:var(--error); }
.switch { width:46px; height:28px; border-radius:99px; background:var(--accent); position:relative; flex:none; } .switch::after { content:""; position:absolute; right:3px; top:3px; width:22px; height:22px; border-radius:50%; background:var(--on); }
.seg { display:flex; background:var(--high); border-radius:99px; padding:3px; } .seg i { font-style:normal; font-size:13px; font-weight:600; padding:6px 10px; border-radius:99px; color:var(--ink2); } .seg i.on { background:var(--surface); color:var(--ink); }
.scroll { position:absolute; top:34px; bottom:0; left:0; right:0; overflow:hidden; }

.upd { margin:0 0 14px; background:var(--surface); border-radius:18px; padding:14px 16px 12px; display:flex; gap:12px; box-shadow:0 8px 20px -14px rgba(0,0,0,.4); }
.upd .ic { width:40px; height:40px; border-radius:12px; background:color-mix(in srgb,var(--accent) 16%,transparent); color:var(--accent); display:grid; place-items:center; flex:none; } .upd .ic svg { width:22px; height:22px; }
.upd .t { flex:1; } .upd b { display:block; font-size:16px; font-weight:600; } .upd p { font-size:14px; line-height:19px; color:var(--ink2); margin-top:2px; }
.upd .acts { display:flex; gap:8px; margin-top:10px; } .btn { height:40px; padding:0 18px; border-radius:99px; font-size:14px; font-weight:600; display:inline-grid; place-items:center; } .btn.p { background:var(--accent); color:var(--on); } .btn.g { color:var(--ink2); }
.bar { height:6px; border-radius:6px; background:var(--high); margin-top:12px; } .bar i { display:block; height:100%; width:42%; border-radius:6px; background:var(--accent); }
.sys { position:absolute; inset:0; background:rgba(0,0,0,.5); }
.sysd { position:absolute; left:24px; right:24px; top:250px; background:#2B2D31; color:#E8EAED; border-radius:26px; padding:24px; } body:not(.dark) .sysd { background:#fff; color:#1F1F1F; }
.sysd .ai { width:44px; height:44px; border-radius:12px; background:#102038; display:grid; place-items:center; } .sysd .ai img { width:44px; }
.sysd h3 { font-size:22px; font-weight:500; margin:14px 0 8px; } .sysd p { font-size:14px; line-height:20px; opacity:.8; }
.sysd .ab { display:flex; justify-content:flex-end; gap:20px; margin-top:22px; font-size:14px; font-weight:600; color:#A8C7FA; } body:not(.dark) .sysd .ab { color:#0B57D0; }
.note { font-size:11px; color:var(--ink2); position:absolute; bottom:14px; left:0; right:0; text-align:center; }
</style>
</head>
<body>
<header class="page"><h1>Update notice</h1><button onclick="document.body.classList.toggle('dark')">Switch light / dark</button></header>
<svg width="0" height="0" style="position:absolute">
  <symbol id="gear" viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z"/></symbol>
  <symbol id="back" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></symbol>
  <symbol id="up" viewBox="0 0 24 24" fill="currentColor"><path d="M11 20V8.8l-4.3 4.3-1.4-1.4L12 5l6.7 6.7-1.4 1.4L13 8.8V20z"/></symbol>
</svg>
<div class="row">
  <figure>
    <div class="phone">
      <div class="status"><span>09.12</span><span>80%</span></div>
      <div class="screen">
        <div class="greet"><h2>Good morning<i>.</i></h2><span class="gear"><svg><use href="#gear"/></svg></span></div>
        <div class="upd"><span class="ic"><svg><use href="#up"/></svg></span><div class="t"><b>Spotifry 0.2.0 is out</b><p>Search and order inside playlists, and you can mix up a playlist's order.</p><div class="acts"><span class="btn p">Update</span><span class="btn g">Later</span></div></div></div>
        <div class="banner"><span class="tag">Last played</span><b>Paper Lanterns</b><span>The Night Owls</span></div>
        <div class="chips"><span class="chip">Saved</span><span class="chip">Playlists</span><span class="chip">Shuffle</span></div>
      </div>
    </div>
    <figcaption><b>1. A new version is out.</b> When the app opens it asks GitHub (at most once a day) whether there's a newer release. If there is, a card sits at the top of Home: the version and the first line of what's new. "Later" hides it until the next version comes out.</figcaption>
  </figure>

  <figure>
    <div class="phone">
      <div class="status"><span>09.12</span><span>80%</span></div>
      <div class="screen">
        <div class="greet"><h2>Good morning<i>.</i></h2><span class="gear"><svg><use href="#gear"/></svg></span></div>
        <div class="upd"><span class="ic"><svg><use href="#up"/></svg></span><div class="t"><b>Downloading 0.2.0…</b><p>3.0 of 7.1 MB. You can keep listening.</p><div class="bar"><i></i></div></div></div>
        <div class="banner"><span class="tag">Last played</span><b>Paper Lanterns</b><span>The Night Owls</span></div>
        <div class="chips"><span class="chip">Saved</span><span class="chip">Playlists</span><span class="chip">Shuffle</span></div>
      </div>
    </div>
    <figcaption><b>2. Update.</b> The new version downloads inside the app, with progress on the card. Music keeps playing. If the download fails, the card says so and the button turns into "Try again".</figcaption>
  </figure>

  <figure>
    <div class="phone">
      <div class="status"><span>09.13</span><span>80%</span></div>
      <div class="screen">
        <div class="greet"><h2>Good morning<i>.</i></h2><span class="gear"><svg><use href="#gear"/></svg></span></div>
        <div class="banner"><span class="tag">Last played</span><b>Paper Lanterns</b><span>The Night Owls</span></div>
      </div>
      <div class="sys"></div>
      <div class="sysd"><span class="ai"><img src="../.github/assets/logo.svg" alt=""></span><h3>Spotifry</h3><p>Do you want to update this app? Your existing data won't be lost.</p><div class="ab"><span>Cancel</span><span>Update</span></div></div>
      <p class="note" style="color:#ccc">Android's own screen, not ours</p>
    </div>
    <figcaption><b>3. Android takes over.</b> Android shows its own "update this app?" screen; the app can't skip it. The first time, Android first asks once to allow Spotifry to install updates, with a switch to turn on. Songs, playlists and history stay.</figcaption>
  </figure>

  <figure>
    <div class="phone">
      <div class="status"><span>09.20</span><span>80%</span></div>
      <div class="scroll">
        <div class="top"><span class="b"><svg><use href="#back"/></svg></span></div>
        <h2 class="title">Settings</h2>
        <p class="group">ABOUT</p>
        <div class="card">
          <div class="item"><div class="t"><b>Spotifry</b><span>Version 0.1.0 · 0.2.0 is out</span></div><span class="val">Update</span></div>
          <div class="item"><div class="t"><b>Check for updates</b><span>Last checked today, 09.12</span></div></div>
          <div class="item"><div class="t"><b>Music from YouTube</b><span>Through NewPipe Extractor, version shown here. If search breaks, this needs an update.</span></div></div>
        </div>
      </div>
    </div>
    <figcaption><b>4. In Settings too.</b> About shows your version and, when there's one, the new version with an Update button, even after "Later". "Check for updates" asks GitHub right now. When up to date it says "You have the newest version".</figcaption>
  </figure>
</div>
</body>
</html>
