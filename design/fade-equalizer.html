<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Spotifry · Fade between songs and equalizer</title>
<style>
@font-face { font-family:"Albert"; src:url("../app/src/main/res/font/albertsans.ttf"); font-weight:400 700; }
:root { --bg:#F4F5F7; --surface:#FFFFFF; --high:#E6E8EC; --line:#E1E4E8; --outline:#C9CDD3; --ink:#15181C; --ink2:#525A64; --accent:#1F5FD6; --on:#fff; --glow:rgba(91,149,255,.5); --error:#B3261E; }
body.dark { --bg:#0C0D10; --surface:#17191E; --high:#1F2228; --line:#1F2228; --outline:#2A2E35; --ink:#F2F3F5; --ink2:#A6ADB6; --accent:#5B95FF; --on:#08152E; --glow:rgba(91,149,255,.30); --error:#F2877A; }
* { box-sizing:border-box; margin:0; }
body { font-family:"Albert",sans-serif; background:#D9DCE1; color:var(--ink); padding:28px 32px 48px; }
body.dark { background:#050608; }
header.page { display:flex; align-items:baseline; gap:24px; margin-bottom:24px; color:#15181C; }
body.dark header.page, body.dark figcaption { color:#C9CDD3; }
header.page h1 { font-size:22px; letter-spacing:-.02em; }
header.page button { font:600 14px "Albert"; border:1px solid currentColor; background:none; color:inherit; border-radius:99px; padding:6px 14px; cursor:pointer; }
.row { display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start; }
figure { width:360px; } figcaption { font-size:14px; line-height:20px; color:#3A4048; margin-top:12px; max-width:340px; }
.phone { width:360px; height:780px; border-radius:34px; overflow:hidden; position:relative; background:var(--bg); box-shadow:0 18px 40px -12px rgba(0,0,0,.35); }
.phone::before { content:""; position:absolute; inset:0 0 auto auto; width:300px; height:260px; background:radial-gradient(closest-side,var(--glow),transparent); transform:translate(30%,-30%); }
.status { height:34px; display:flex; justify-content:space-between; align-items:center; padding:0 22px; font-size:13px; font-weight:600; position:relative; }
.screen { padding:0 20px; position:relative; }
.greet { display:flex; justify-content:space-between; align-items:center; margin:16px 0 14px; }
.greet h2 { font-size:34px; letter-spacing:-.68px; } .greet h2 i { color:var(--accent); font-style:normal; }
.gear { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--surface); }
.gear svg { width:22px; height:22px; }
.banner { height:200px; border-radius:22px; background:linear-gradient(160deg,#5d5785,#1b1930); color:#fff; padding:18px; }
.banner span.tag { font-size:12px; font-weight:600; background:rgba(0,0,0,.35); padding:4px 10px; border-radius:99px; }
.banner b { display:block; font-size:28px; margin-top:12px; } .banner span { font-size:15px; opacity:.85; }
.chips { display:flex; gap:8px; margin-top:14px; } .chip { flex:1; height:46px; border-radius:99px; background:var(--surface); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; }
.top { display:flex; align-items:center; gap:6px; padding:4px 8px 0; } .top svg { width:24px; height:24px; } .top .b { width:48px; height:48px; display:grid; place-items:center; }
h2.title { font-size:34px; letter-spacing:-.68px; font-weight:700; margin:4px 20px 8px; }
.group { font-size:13px; font-weight:700; color:var(--ink2); margin:18px 20px 6px; letter-spacing:.02em; }
.card { margin:0 12px; background:var(--surface); border-radius:18px; overflow:hidden; }
.item { display:flex; align-items:center; gap:14px; padding:12px 16px; min-height:60px; border-top:1px solid var(--line); }
.item:first-child { border-top:0; }
.item .t { flex:1; } .item b { display:block; font-weight:500; font-size:16px; } .item span { font-size:13px; color:var(--ink2); }
.item .val { font-size:14px; font-weight:600; color:var(--accent); }
.item.danger b { color:var(--error); }
.switch { width:46px; height:28px; border-radius:99px; background:var(--accent); position:relative; flex:none; } .switch::after { content:""; position:absolute; right:3px; top:3px; width:22px; height:22px; border-radius:50%; background:var(--on); }
.seg { display:flex; background:var(--high); border-radius:99px; padding:3px; } .seg i { font-style:normal; font-size:13px; font-weight:600; padding:6px 10px; border-radius:99px; color:var(--ink2); } .seg i.on { background:var(--surface); color:var(--ink); }
.scroll { position:absolute; top:34px; bottom:0; left:0; right:0; overflow:hidden; }

.seg i { padding:6px 9px; }
.eqtop { display:flex; align-items:center; justify-content:space-between; padding:4px 8px 0 8px; } .eqtop .b { width:48px; height:48px; display:grid; place-items:center; } .eqtop svg { width:24px; height:24px; }
.switch.off { background:var(--high); box-shadow:inset 0 0 0 1px var(--outline); } .switch.off::after { left:3px; right:auto; background:var(--ink2); }
.presets { display:flex; flex-wrap:wrap; gap:8px; margin:6px 20px 0; } .presets span { height:36px; padding:0 14px; border-radius:99px; border:1px solid var(--outline); display:grid; place-items:center; font-size:14px; font-weight:600; } .presets span.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.bands { margin:18px 12px 0; background:var(--surface); border-radius:18px; padding:18px 10px 14px; display:flex; justify-content:space-around; }
.band { display:flex; flex-direction:column; align-items:center; gap:8px; font-size:12px; color:var(--ink2); width:52px; }
.band b { font-size:13px; color:var(--ink); font-variant-numeric:tabular-nums; }
.vt { width:6px; height:200px; border-radius:6px; background:var(--high); position:relative; } .vt::before { content:""; position:absolute; left:-6px; right:-6px; top:50%; height:1px; background:var(--outline); }
.vt i { position:absolute; left:0; right:0; border-radius:6px; background:var(--accent); } .vt s { position:absolute; left:50%; width:22px; height:22px; border-radius:50%; background:var(--accent); transform:translate(-50%,-50%); box-shadow:0 2px 6px rgba(0,0,0,.25); }
.note2 { font-size:13px; line-height:18px; color:var(--ink2); margin:12px 20px 0; }
.viz { margin:16px 12px 0; height:132px; background:var(--surface); border-radius:18px; padding:6px 0 0; position:relative; overflow:hidden; }
.viz svg { width:100%; height:120px; display:block; }
.viz .wave { transform-origin:50% 100%; animation:pulse 1.1s ease-in-out infinite alternate; }
@keyframes pulse { from { transform:scaleY(.82); } to { transform:scaleY(1.04); } }
@media (prefers-reduced-motion: reduce) { .viz .wave { animation:none; } }
.vlab { position:absolute; left:14px; top:8px; font-size:12px; font-weight:600; color:var(--ink2); }
.bands { margin-top:10px !important; }
.vt { height:150px !important; }
</style></head>
<body>
<header class="page"><h1>Fade between songs and equalizer</h1><button onclick="document.body.classList.toggle('dark')">Switch light / dark</button></header>
<svg width="0" height="0" style="position:absolute">
  <symbol id="gear" viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z"/></symbol>

</svg>
<div class="row">

      <div class="scroll">
        <div class="top"><span class="b"><svg><use href="#back"/></svg></span></div>
        <h2 class="title">Settings</h2>
        <p class="group">SOUND</p>
        <div class="card">
          <div class="item"><div class="t"><b>Same loudness for every song</b><span>Quiet songs are turned up and loud ones down.</span></div><span class="switch"></span></div>
          <div class="item"><div class="t"><b>Skip quiet parts</b><span>Jumps over silence inside songs.</span></div><span class="switch off"></span></div>
          <div class="item" style="outline:2px dashed var(--accent);outline-offset:-4px;border-radius:12px;flex-wrap:wrap"><div class="t" style="flex-basis:100%"><b>Fade between songs</b><span>The end of a song fades out and the next one fades in.</span></div><span class="seg" style="margin-top:8px"><i>Off</i><i>2 s</i><i class="on">5 s</i><i>8 s</i><i>12 s</i></span></div>
          <div class="item" style="outline:2px dashed var(--accent);outline-offset:-4px;border-radius:12px"><div class="t"><b>Equalizer</b><span>Bass boost</span></div><svg style="width:22px;height:22px;color:var(--ink2)"><use href="#chev"/></svg></div>
          <div class="item"><div class="t"><b>Save quality</b><span>Songs you save to the phone</span></div><span class="seg"><i class="on">High</i><i>Low</i></span></div>
        </div>
      </div>
    </div>
    <figcaption><b>1. Settings → Sound</b> gets two new lines (dashed). <b>Fade between songs:</b> Off, 2, 5, 8 or 12 seconds; off by default. Only when one song runs into the next; skipping with Next stays instant. <b>Equalizer:</b> shows the sound in use ("Off", "Bass boost", "Custom") and opens its own page.</figcaption>
  </figure>

    </div>
    <figcaption><b>2. Equalizer page.</b> At the top, a <b>live picture of the music</b> while a song plays (low notes left, high right), already shaped by your equalizer, so dragging a bar visibly lifts or lowers that part of the wave. The dashed line is your equalizer curve. When nothing plays, the wave lies flat. Needs no microphone permission: the app reads its own sound. A switch at the top turns it on or off. Ready-made sounds as buttons; five bars for your own mix, heard at once while you drag. The names and number of bars come from your phone, so they can differ a little between phones. Works for every song, saved or streamed.</figcaption>
