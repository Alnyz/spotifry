<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music app: record liner notes</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Albert+Sans:wght@300;400;500;600&family=Figtree:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Martian+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{background:#050506;color:#e9e9ea;font:16px/1.5 'Figtree',sans-serif;padding:32px 24px 90px}
h1{font-size:26px}.n{color:#9a9a9f;max-width:76ch;margin:8px 0 34px}
section{margin-bottom:70px}
.k{font:600 12px 'Figtree';letter-spacing:.08em;color:#9a9a9f}
section h2{font-size:22px;margin-top:2px}
section p{color:#a8a8ad;max-width:76ch;margin:4px 0 6px}
section p.risk{color:#c9a27a}
.row{display:flex;gap:30px;flex-wrap:wrap;margin-top:16px}
figure{width:390px}figcaption{color:#a0a0a6;font-size:14px;margin-top:10px}
.phone{width:390px;height:844px;border-radius:34px;overflow:hidden;position:relative;border:1px solid #2a2a2e;background:var(--g);color:var(--t);font-family:var(--f)}
.sb{height:30px;padding:8px 24px 0;display:flex;justify-content:space-between;font:600 13px system-ui;position:relative;z-index:6}
.scr{position:absolute;inset:30px 0 0 0;overflow:hidden}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}
.ib{width:48px;height:48px;display:grid;place-items:center;flex:none}
.pad{padding:0 20px;position:relative}
.t2{color:var(--t2)}
/* placeholder covers */
.c{position:relative;overflow:hidden;flex:none}
.c1{background:linear-gradient(160deg,#36506e 0,#6d8fb0 45%,#d6c6a4 100%)}
.c2{background:linear-gradient(200deg,#1d2b2a 0,#4f6d63 50%,#c9b38a 100%)}
.c3{background:linear-gradient(170deg,#3b2433 0,#8a4a5a 55%,#e3a07a 100%)}
.c4{background:linear-gradient(180deg,#22262e 0,#5c6575 50%,#b9c0c8 100%)}
.c5{background:linear-gradient(150deg,#2c2a3f 0,#5d5785 55%,#c6a8c8 100%)}
.c6{background:linear-gradient(190deg,#2b2318 0,#7a5b37 55%,#d8b682 100%)}
.c:after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:rgba(10,10,12,.85);clip-path:polygon(0 70%,12% 40%,22% 62%,35% 20%,48% 55%,60% 35%,72% 60%,86% 30%,100% 55%,100% 100%,0 100%)}
.gray{filter:grayscale(1) contrast(1.05) brightness(.9)}
/* glass, shared by the two allowed components */
.glass{background:var(--gl);backdrop-filter:blur(22px) saturate(140%);border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.mini{position:absolute;left:10px;right:10px;bottom:90px;height:64px;border-radius:18px;display:flex;align-items:center;gap:12px;padding:0 6px 0 8px;z-index:4;overflow:hidden}
.mini .c{width:48px;height:48px;border-radius:10px}.mini .m{flex:1;min-width:0;font-size:15px}.mini .m b{display:block;font-weight:600}
.mini .pr{position:absolute;left:0;bottom:0;height:2px;width:40%;background:var(--a)}
.nav{position:absolute;left:0;right:0;bottom:0;height:82px;background:var(--g);border-top:1px solid var(--l);display:flex;padding-top:12px;z-index:3}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500;color:var(--t2)}
.nav a.on{color:var(--t)} .nav a.on svg{color:var(--na)}
.top{display:flex;justify-content:space-between;align-items:center;padding:0 8px;position:relative;z-index:3}
.panel{position:absolute;left:10px;right:10px;bottom:12px;border-radius:26px;padding:14px 18px 10px;z-index:4}
.bar{height:3px;background:rgba(255,255,255,.2);position:relative;border-radius:2px}.bar i{position:absolute;inset:0 62% 0 0;background:var(--t);border-radius:2px}
.bar u{position:absolute;left:38%;top:-6px;width:3px;height:15px;background:var(--a);border-radius:2px}
.tm{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-top:8px;font-variant-numeric:tabular-nums}
.ct{display:flex;justify-content:space-between;align-items:center;margin:4px 0}
.pb{width:68px;height:68px;border-radius:50%;background:var(--t);color:var(--g);display:grid;place-items:center}.pb svg{width:32px;height:32px}
.r2{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.1);margin-top:6px;padding-top:2px;font-size:14px;font-weight:500}
.r2 span{height:46px;display:flex;align-items:center;gap:8px;padding:0 4px}
.srch{height:50px;border-radius:12px;background:var(--s);display:flex;gap:12px;align-items:center;padding:0 16px;color:var(--t2);font-size:16px}
/* A: darkroom contact sheet */
.A{--g:#0B0B0C;--s:#17171A;--l:#222226;--t:#EDEDEE;--t2:#9C9CA2;--a:#E0453A;--na:#E0453A;--gl:rgba(11,11,12,.80);--f:'Schibsted Grotesk',sans-serif}
.A h3{font-weight:600;font-size:15px;color:var(--t2);margin:22px 0 10px;display:flex;justify-content:space-between}
.sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.fr .c{aspect-ratio:1;width:100%}.fr small{display:block;font-size:11px;color:var(--t2);margin-top:3px;font-variant-numeric:tabular-nums}
.fr.on{outline:2px solid var(--a);outline-offset:2px}
.fr.on .c{filter:none}
/* B: liner notes */
.B{--g:#121417;--s:#1B1E23;--l:#24282E;--t:#E8EAED;--t2:#9AA1AA;--a:#8FB3E0;--na:#8FB3E0;--gl:rgba(18,20,23,.80);--f:'Albert Sans',sans-serif}
.B .h{font-weight:300;font-size:40px;letter-spacing:-.02em}
.B .lab{font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--t2);margin:26px 0 10px}
.tl{display:flex;gap:14px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--l);font-size:16px}
.tl em{font-style:normal;color:var(--t2);width:18px;font-variant-numeric:tabular-nums;font-size:13px}.tl b{font-weight:400;flex:1}.tl span{color:var(--t2);font-size:13px;font-variant-numeric:tabular-nums}
/* C: catalog wall */
.C{--g:#0A0B0D;--s:#15171B;--l:#1F2227;--t:#F1F2F4;--t2:#9EA3AB;--a:#5B8CFF;--na:#5B8CFF;--gl:rgba(10,11,13,.80);--f:'Figtree',sans-serif}
.C h3{font-size:18px;font-weight:600;margin:20px 20px 10px}
.wall{display:flex;gap:10px;padding:0 20px;overflow:hidden;align-items:flex-start}
.tile .c{width:112px;height:112px;border-radius:10px;opacity:.55}
.tile.f .c{width:150px;height:150px;opacity:1;outline:2px solid var(--a);outline-offset:3px}
.tile b{display:block;font-size:14px;font-weight:600;margin-top:10px}.tile small{color:var(--t2);font-size:13px}
/* D: type specimen */
.D{--g:#0C0C0D;--s:#161618;--l:#232326;--t:#F2F1EE;--t2:#9D9C98;--a:#7C8CFF;--na:#7C8CFF;--gl:rgba(12,12,13,.80);--f:'Bricolage Grotesque',sans-serif}
.D .mono{font-family:'Martian Mono',monospace;font-size:11px;color:var(--t2)}
.D .giant{font-weight:800;font-size:64px;line-height:.92;letter-spacing:-.04em}
.D .ti{display:flex;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--l)}
.D .ti b{font-weight:600;font-size:24px;letter-spacing:-.02em;flex:1;line-height:1.1}
.B .tl{align-items:center;padding:8px 0}
.B .tl .c{width:48px;height:48px;border-radius:4px}
.B .tl .m{flex:1;min-width:0}.B .tl .m b{display:block;font-weight:400;font-size:16px}.B .tl .m small{color:var(--t2);font-size:13px;display:flex;gap:5px;align-items:center}
.B .tl .m small svg{width:14px;height:14px;color:var(--a)}
.B .pl{display:flex;gap:16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--l)}
.mos{width:64px;height:64px;display:grid;grid-template-columns:1fr 1fr;gap:2px;flex:none;border-radius:4px;overflow:hidden}
.mos .c{width:100%;height:100%}.mos .c:after{display:none}
.fab{position:absolute;right:16px;bottom:168px;height:52px;border-radius:14px;background:var(--a);color:#0E1520;display:flex;gap:8px;align-items:center;padding:0 18px 0 14px;font-weight:600;z-index:4}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="home" viewBox="0 0 24 24"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></symbol>
<symbol id="dl" viewBox="0 0 24 24"><path d="M11 4h2v8.2l2.6-2.6L17 11l-5 5-5-5 1.4-1.4L11 12.2zM5 18h14v2H5z"/></symbol>
<symbol id="list" viewBox="0 0 24 24"><path d="M3 6h14v2H3zm0 5h14v2H3zm0 5h9v2H3zm15-5v5.3a2.7 2.7 0 1 0 2 2.6V8h3V6h-5z"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
<symbol id="pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></symbol>
<symbol id="next" viewBox="0 0 24 24"><path d="M6 6l9 6-9 6zm10 0h2v12h-2z"/></symbol>
<symbol id="prev" viewBox="0 0 24 24"><path d="M18 6l-9 6 9 6zM6 6h2v12H6z"/></symbol>
<symbol id="shuf" viewBox="0 0 24 24"><path d="M16 4h5v5l-1.8-1.8L5.4 21 4 19.6 17.8 5.8zM4 4.4 9.5 10 8.1 11.4 2.6 5.8zm10.6 8.2 1.4-1.4 3.2 3.2L21 12.6V18h-5.4l1.8-1.8z"/></symbol>
<symbol id="rep" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></symbol>
<symbol id="down" viewBox="0 0 24 24"><path d="M7.4 9 12 13.6 16.6 9 18 10.4l-6 6-6-6z"/></symbol>
<symbol id="more" viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></symbol>
<symbol id="q" viewBox="0 0 24 24"><path d="M3 6h12v2H3zm0 5h12v2H3zm0 5h8v2H3zm13-1v-3l5 3.5-5 3.5v-3z"/></symbol>
</defs></svg>
<h1>Record liner notes, with covers on every song</h1>
<p class="n">Every song row now shows its cover, so you can spot a song by its picture. Four screens. Covers and names are placeholders; "Music" is a text placeholder.</p>
<div class="row" id="out"></div>
<script>
const I=n=>`<svg class="i"><use href="#${n}"/></svg>`;
const st='<div class="sb"><span>9:41</span><span>5G ▮▮▮</span></div>';
const ph=(b,cap)=>`<figure><div class="phone B">${st}<div class="scr">${b}</div></div><figcaption>${cap}</figcaption></figure>`;
const nav=on=>`<div class="nav">${[['home','Listen'],['dl','Saved'],['list','Playlists']].map(([i,l],k)=>`<a class="${k==on?'on':''}">${I(i)}${l}</a>`).join('')}</div>`;
const mini=`<div class="mini glass"><div class="c c4"></div><div class="m"><b>Sample song 1</b><span class="t2">Artist name</span></div><div class="ib">${I('pause')}</div><div class="ib">${I('next')}</div><div class="pr"></div></div>`;
const cv=['c1','c2','c3','c5','c6','c1','c3'];
const song=(n,k,saved,more=true)=>`<div class="tl"><div class="c ${cv[k%7]}"></div><div class="m"><b>Sample song ${n}</b><small>${saved?I('dl'):''}Artist name</small></div><span>3:4${k%10}</span>${more?`<div class="ib" style="width:36px">${I('more')}</div>`:''}</div>`;
const panel=`<div class="panel glass"><div class="bar"><i></i><u></u></div><div class="tm"><span>1:24</span><span>3:41</span></div><div class="ct"><div class="ib">${I('shuf')}</div><div class="ib">${I('prev')}</div><div class="pb">${I('pause')}</div><div class="ib">${I('next')}</div><div class="ib">${I('rep')}</div></div><div class="r2"><span><span style="color:var(--a);display:flex">${I('dl')}</span>Saved on this phone</span><span>${I('q')}Up next</span></div></div>`;
const out=[
ph(`<div class="pad"><div style="font-size:13px;color:var(--t2);margin-top:10px">Music</div><div class="h" style="margin-top:4px">Listen</div>
<div class="srch" style="margin-top:16px;border-radius:10px">${I('search')}Search a song or artist</div>
<div class="lab">LAST PLAYED</div><div style="display:flex;gap:16px;align-items:flex-end"><div class="c c4" style="width:132px;height:132px;border-radius:4px"></div><div><div style="font-size:22px;font-weight:300;line-height:1.15">Sample song 1</div><div class="t2" style="font-size:14px;margin-top:4px">Artist name</div><div style="margin-top:12px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--a)">${I('play')}Play again</div></div></div>
<div class="lab">RECENTLY PLAYED</div>${[2,3,4,5].map((n,k)=>song(n,k,k%2==0)).join('')}</div>${mini}${nav(0)}`,'Listen. Last played big, then recent songs, each with its cover.'),
ph(`<div class="top"><div class="ib">${I('down')}</div><span style="font-size:13px;color:var(--t2);letter-spacing:.06em">NOW PLAYING</span><div class="ib">${I('more')}</div></div>
<div class="pad" style="margin-top:14px"><div class="c c4" style="width:240px;height:240px;border-radius:4px;margin:0 auto"></div>
<div style="font-size:30px;font-weight:300;margin-top:22px;letter-spacing:-.01em">Sample song 1</div><div class="t2" style="display:flex;gap:6px;align-items:center"><span style="color:var(--a);display:flex">${I('dl')}</span>Artist name</div>
<div class="lab" style="margin-top:16px">UP NEXT</div>${[2,3].map((n,k)=>song(n,k,false,false)).join('')}</div>${panel}`,'Now playing. The next songs show their covers too.'),
ph(`<div class="pad"><div style="font-size:13px;color:var(--t2);margin-top:10px">Music</div><div class="h" style="margin-top:4px">Saved</div><div class="t2" style="font-size:14px">5 songs, plays without internet</div>
<div style="margin-top:14px">${[1,4,6,7,8].map((n,k)=>song(n,k+2,true)).join('')}</div></div>${mini}${nav(1)}`,'Saved. Every row has the download mark and its cover.'),
ph(`<div class="pad"><div style="font-size:13px;color:var(--t2);margin-top:10px">Music</div><div class="h" style="margin-top:4px">Playlists</div>
<div style="margin-top:14px">${[['Playlist name','12 songs · 9 saved',0],['Playlist name','8 songs · 8 saved',2],['Playlist name','20 songs · 0 saved',4]].map(([a,b,o])=>`<div class="pl"><div class="mos">${[0,1,2,3].map(j=>`<div class="c ${cv[(o+j)%7]}"></div>`).join('')}</div><div style="flex:1"><div style="font-size:17px">${a}</div><div class="t2" style="font-size:13px">${b}</div></div><div class="ib" style="width:36px">${I('more')}</div></div>`).join('')}</div></div>
<div class="fab">${I('list')}New playlist</div>${mini}${nav(2)}`,'Playlists. Each shows the covers of its first four songs.'),
];
document.getElementById('out').innerHTML=out.join('');
</script></body></html>
