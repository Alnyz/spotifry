<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music app, UI draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0D1411; --surface:#16201B; --surface2:#1F2B25; --line:#2A3A32;
  --text:#EEF3EF; --text2:#A9B7AF; --accent:#F4C430; --on-accent:#14110A;
  --r1:#FF8A4C; --r2:#38D0B4; --r3:#F0566E;
  --glass:rgba(13,20,17,.62);
}
.light{
  --ground:#EDF2EE; --surface:#FFFFFF; --surface2:#E0E8E2; --line:#C5D1C9;
  --text:#0F1A14; --text2:#44554B; --glass:rgba(237,242,238,.72);
}
*{box-sizing:border-box;margin:0}
body{background:#070B09;color:#EEF3EF;font-family:Barlow,'Helvetica Neue',Arial,sans-serif;padding:32px 20px 64px}
h1{font:700 28px 'Barlow Condensed','Arial Narrow',Arial,sans-serif,'Arial Narrow',Arial,sans-serif;letter-spacing:.02em}
.note{color:#A9B7AF;max-width:62ch;margin:8px 0 32px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,360px));gap:40px 32px;justify-content:center}
figure{width:360px}
figcaption{margin-top:12px;color:#A9B7AF;font-size:14px}

/* phone */
.phone{width:360px;height:760px;border-radius:36px;overflow:hidden;position:relative;background:var(--ground);color:var(--text);border:1px solid #2A3A32}
.status{height:28px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font:500 12px Barlow,Arial,sans-serif;color:var(--text)}
.screen{position:absolute;inset:28px 0 0 0;overflow:hidden}
.pad{padding:8px 16px 0}
h2{font:700 30px/1 'Barlow Condensed','Arial Narrow',Arial,sans-serif;letter-spacing:.01em}
h3{font:600 14px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;letter-spacing:.08em;color:var(--text2);margin:22px 0 8px;text-transform:uppercase}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}

/* search */
.search{display:flex;align-items:center;gap:12px;height:52px;padding:0 16px;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--text2);font-size:16px}
.search b{font-weight:500;color:var(--text)}

/* rows */
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:6px 0}
.cover{width:52px;height:52px;border-radius:8px;flex:none;position:relative;overflow:hidden}
.c1{background:linear-gradient(115deg,var(--r1) 0 38%,#1b2a23 38% 46%,var(--accent) 46% 60%,#1b2a23 60%)}
.c2{background:linear-gradient(115deg,#1b2a23 0 30%,var(--r2) 30% 52%,#1b2a23 52% 58%,var(--accent) 58%)}
.c3{background:linear-gradient(115deg,var(--r3) 0 45%,var(--accent) 45% 55%,#1b2a23 55%)}
.c4{background:linear-gradient(115deg,var(--accent) 0 28%,#1b2a23 28% 36%,var(--r2) 36% 70%,var(--r1) 70%)}
.meta{flex:1;min-width:0}
.title{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:14px;color:var(--text2);display:flex;gap:6px;align-items:center}
.off{color:var(--accent)} .off svg{width:16px;height:16px}
.light .off{color:#6B5400}
.iconbtn{width:48px;height:48px;display:grid;place-items:center;border:0;background:none;color:var(--text);border-radius:24px}

/* route plates (identity motif) */
.routes{display:flex;gap:10px;overflow:hidden}
.route{width:148px;flex:none;background:var(--surface);border-radius:12px;padding:12px 12px 0;position:relative;overflow:hidden;height:132px}
.plate{display:inline-grid;place-items:center;min-width:34px;height:26px;padding:0 6px;border-radius:5px;font:700 18px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;color:#14110A}
.route .name{font-weight:600;margin-top:10px}
.route .sub{margin-top:2px}
.stripe{position:absolute;left:0;right:0;bottom:0;height:8px}
.p1{background:var(--r1)} .p2{background:var(--r2)} .p3{background:var(--r3)} .p0{background:var(--accent)}

/* glass: only the mini player and the full-player sheet */
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);border:1px solid rgba(255,255,255,.14)}
.light .glass{border-color:rgba(0,0,0,.08)}
.mini{position:absolute;left:8px;right:8px;bottom:88px;height:64px;border-radius:16px;display:flex;align-items:center;gap:12px;padding:0 4px 0 6px;overflow:hidden}
.mini .cover{width:48px;height:48px}
.mini .prog{position:absolute;left:0;bottom:0;height:3px;width:42%;background:var(--accent)}

/* bottom nav (solid) */
.nav{position:absolute;left:0;right:0;bottom:0;height:80px;background:var(--surface);display:flex;border-top:1px solid var(--line)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:12px;font:500 12px Barlow,Arial,sans-serif;color:var(--text2);text-decoration:none}
.nav a .pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center}
.nav a.on{color:var(--text)} .nav a.on .pill{background:var(--accent);color:var(--on-accent)}
.fab{position:absolute;right:16px;bottom:96px;height:56px;padding:0 20px 0 16px;border-radius:16px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;gap:10px;font:600 16px Barlow,Arial,sans-serif;border:0}

/* states */
.skel{background:var(--surface2);border-radius:6px}
.err{display:flex;gap:12px;align-items:center;min-height:64px;padding:8px 12px;margin-top:6px;border-radius:12px;background:var(--surface);border:1px solid var(--r3)}
.err .t{flex:1;font-size:14px;line-height:1.35}
.btn{height:48px;padding:0 20px;border-radius:12px;border:0;font:600 16px Barlow,Arial,sans-serif;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--line);height:40px;padding:0 14px}
.empty{padding:96px 32px 0;text-align:center}
.empty .big{font:700 34px/1 'Barlow Condensed','Arial Narrow',Arial,sans-serif}
.empty p{color:var(--text2);line-height:1.5;margin:12px 0 24px}

/* now playing */
.np{background:var(--ground)}
.np .bgart{position:absolute;inset:0}
.np .bgart .cover{position:absolute;inset:-40px;width:auto;height:auto;border-radius:0;filter:blur(30px) saturate(1.1);transform:scale(1.2)}
.np .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,20,17,.35),rgba(13,20,17,.85) 70%)}
.light.np .shade{background:linear-gradient(180deg,rgba(237,242,238,.4),rgba(237,242,238,.9) 70%)}
.np .top{position:relative;display:flex;align-items:center;justify-content:space-between;padding:4px 8px}
.np .top .ctx{text-align:center;font-size:13px;color:var(--text2)} .np .top .ctx b{display:block;color:var(--text);font:600 15px Barlow,Arial,sans-serif}
.np .art{position:relative;width:268px;height:268px;border-radius:16px;margin:16px auto 0;overflow:hidden}
.np .art .cover{width:100%;height:100%;border-radius:0}
.np .info{position:relative;padding:18px 20px 0;display:flex;align-items:center;gap:12px}
.np .info .meta .title{font:700 28px/1.05 'Barlow Condensed','Arial Narrow',Arial,sans-serif} .np .info .sub{font-size:15px;margin-top:2px}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;border-radius:24px;padding:18px 18px 12px}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.22);position:relative}
.light .bar{background:rgba(0,0,0,.18)}
.bar i{position:absolute;left:0;top:0;bottom:0;width:38%;border-radius:4px;background:var(--accent)}
.bar u{position:absolute;left:calc(38% - 9px);top:-5px;width:18px;height:18px;border-radius:9px;background:var(--accent);border:3px solid var(--ground)}
.times{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-top:10px}
.ctrls{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.play{width:72px;height:72px;border-radius:22px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;border:0}
.play svg{width:34px;height:34px}
.sheet .row2{display:flex;justify-content:space-between;margin-top:6px;border-top:1px solid rgba(255,255,255,.12);padding-top:6px}
.light .sheet .row2{border-color:rgba(0,0,0,.1)}
.row2 button{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;background:none;border:0;color:var(--text);font:500 14px Barlow,Arial,sans-serif}
</style>
</head>
