name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options: [Android, Linux, Windows, Mac]
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Spotifry version
      description: Settings → About
      placeholder: "1.3.0"
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to repeat it
  - type: textarea
    id: extra
    attributes:
      label: Phone or computer, Android version, screenshots
