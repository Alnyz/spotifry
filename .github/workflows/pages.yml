name: site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  # A new release puts its version and download links into the page. The Mac beta also triggers this, but
  # "latest" skips pre-releases, so the page keeps the main release.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # the Mac beta is a pre-release: it changes nothing on the page, and its tag may not publish the site
    if: github.event_name != 'release' || !github.event.release.prerelease
    # on the job, not the workflow: a skipped Mac beta run then never joins the group, so it can't cancel the main release's run
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Put the newest release version into the page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name | sed 's/^v//')
          old=$(grep -oP 'data-ver>\K[0-9.]+' site/index.html | head -1)
          echo "page has $old, newest release is $new"
          if [ -n "$new" ] && [ -n "$old" ]; then sed -i "s/${old//./\\.}/$new/g" site/index.html; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
